<script>
const DOC = "Family History";
const PAGES = [

{cover:true, html:`
  <div class="c-top"><span class="c-mark">🌳</span><span class="c-pill">A Family History</span></div>
  <div class="c-mid">
    <div class="c-eyebrow">Arocho &middot; Marrero &middot; Cardona &middot; Huertas</div>
    <h1>The Line <span class="accent">to Omar</span></h1>
    <p class="c-sub">From a farming family in Añasco and Lares, Puerto Rico &mdash; to the day they got to me.</p>
    <div class="c-meta">
      <div class="cm-l"><div class="cm-by">Researched and compiled by Claude, for Omar Huertas</div><div class="cm-rel">First edition &middot; July 2026</div></div>
      <div class="cm-r">Sourced from FamilySearch, Ancestry, primary family documents, and a headstone in Arecibo.</div>
    </div>
  </div>`},

{doc:"How We Know This", html:`
  <span class="eyebrow">Before the story begins</span>
  <h1>How we know this is true.</h1>
  <p class="lead">Every name in this book was checked, not assumed.</p>
  <p>This story began with a photograph of a headstone at Cementerio Privado La Santa Cruz, in Arecibo, Puerto Rico. From there, it was built outward &mdash; person by person, record by record &mdash; using FamilySearch's sourced civil and parish registrations, an Ancestry.com printout your mother compiled, and primary documents like a funeral card and downloaded Puerto Rico civil registry certificates.</p>
  <p>Along the way, a tempting but false lead surfaced: a chain that appeared to connect this family to Spanish nobility and the Aztec emperor Moctezuma I. It was checked and rejected &mdash; a real but unrelated Colombian family, wrongly merged onto one ancestor's profile by another researcher, with no genuine documentation connecting it here. That branch is not in this book. What follows is only what could be verified.</p>
  <p>This book tells the story; it doesn't show every step of the research. For the full working log &mdash; which document proved which fact, which leads were checked and rejected and why, and what's still an open question &mdash; the project's research notes are kept alongside the family tree itself. Ask Omar if you want to see them, or if you're picking up a thread yourself.</p>
  <div class="who">Where a date or fact isn't certain, this book says so &mdash; the same way the family tree site does.</div>`},

{doc:"The World Before", html:`
  <span class="eyebrow">Setting the scene &middot; not your family's own record</span>
  <h1>Añasco, before anyone in this book was born.</h1>
  <p class="lead">To understand the family, it helps to understand the ground they stood on.</p>
  <p>Añasco was founded in 1733 by a colonist from Extremadura, Spain, on land already inhabited by the Taíno people for centuries &mdash; the region is believed to be where the Taíno rebellion against Spanish rule first broke out in the early 1500s. By the time Máximo Arocho and María Ramona Román were born there, generations later, Añasco had settled into what it would remain for the next two hundred years: a rural farming town, growing plantains and provisions along the Río Grande de Añasco.</p>
  <p>Lares, twenty-some miles inland, was younger &mdash; founded in 1827, just a year or so before Martín Arocho y Román was born there. It grew up almost entirely around one crop: coffee, introduced to the island in 1736 and, by the mid-1800s, its most valuable export. The mountainous terrain around Lares was made for it.</p>
  <div class="who">This page describes the towns, not this specific family &mdash; no record yet connects Máximo or Ramona to a particular farm, plantation, or event. It's the world they were born into, as best as public history can reconstruct it.</div>`},

{doc:"Where This Story Happens", html:`
  <span class="eyebrow">A map, for anyone who's never been</span>
  <h1>Three countries, three real maps.</h1>
  <p class="lead">Not everyone reading this has stood on this ground. These are real, published maps &mdash; not sketches &mdash; showing exactly where this family's places sit.</p>

  <p style="font-family:Georgia,serif; font-size:0.95rem; font-weight:700; color:#7a5a22; margin:1.2rem 0 0.4rem;">PUERTO RICO &mdash; where almost everyone comes from</p>
  <img class="doc-photo" src="img/map_puerto_rico_real.png" alt="Map of the municipalities of Puerto Rico" style="background:#dff0fa; padding:10px;">
  <div class="doc-photo-cap">Every one of the family's confirmed towns sits along the north coast and northwest interior of this map: Añasco, Moca, Las Marías, and Lares in the western mountains; Camuy and Arecibo on the north coast; Río Grande, Canóvanas, and Loíza on the northeast coast &mdash; the deep Ceballo root, documented back to 1825. San Germán and Lajas, in the dry southwest, are the one in-law branch (Del Toro/Servera), not blood.</div>

  <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; margin:1.4rem 0 10px;">
    <div style="flex:1; min-width:200px;">
      <p style="font-family:Georgia,serif; font-size:0.95rem; font-weight:700; color:#7a5a22; margin:0 0 0.4rem;">SPAIN &mdash; one confirmed line back across the Atlantic</p>
      <img class="doc-photo" src="img/map_spain_cadiz_real.png" alt="Map of Spain with Cádiz province marked" style="max-width:220px; background:#fff; padding:8px;">
      <div class="doc-photo-cap">Cádiz, on Spain's southern Atlantic coast &mdash; Vicente Medina, a 4th great-grandfather, was born here around 1825.</div>
    </div>
    <div style="flex:1; min-width:200px;">
      <p style="font-family:Georgia,serif; font-size:0.95rem; font-weight:700; color:#7a5a22; margin:0 0 0.4rem;">COLOMBIA &mdash; Omar's father's line</p>
      <img class="doc-photo" src="img/map_colombia_bogota_real.png" alt="Map of Colombia with Cundinamarca/Bogotá marked" style="max-width:220px; background:#fff; padding:8px;">
      <div class="doc-photo-cap">Cundinamarca, the department around Bogotá &mdash; Juan José Huertas Vargas was born in the capital in 1946.</div>
    </div>
  </div>

  <p>Almost the entire family, generation after generation, comes from a tight cluster of towns in the mountains and coffee country of northwest Puerto Rico &mdash; Añasco, Lares, Moca, Las Marías, Utuado, Camuy, Arecibo &mdash; most within about thirty miles of each other. San Germán and Lajas, in the island's dry southwest corner, are the one outlier on that side: the Del Toro/Servera in-law branch. On the opposite, Atlantic-facing northeast coast sits the other outlier &mdash; Río Grande, Canóvanas, and Loíza, the deep root of the Ceballo line, documented back to 1825 and the site of the "Mulatto" 1910 census record.</p>
  <p>Two threads reach off the island entirely. One is Spanish: Vicente Medina, a 4th great-grandfather, was born around 1825 in Cádiz, on Spain's southern Atlantic coast, and made his way to Puerto Rico sometime before his daughter Felipa was born there in 1845. The other is Colombian: Omar's own father, Juan José Huertas Vargas, was born in Bogotá in 1946 &mdash; a completely separate line that only joined the Puerto Rican side of the family when he and Yadyra Marrero had Omar.</p>
  <div class="who">Puerto Rico municipal map: "Mapa de los municipios de Puerto Rico (sin etiquetas)" by BrankoMarinovic99, Wikimedia Commons, CC0 public domain, 2024. Spain/Cádiz and Colombia/Cundinamarca location maps: Wikimedia Commons, public domain location-map series. All three are real, published maps, not schematic drawings.</div>`},

{doc:"Añasco & Lares", html:`
  <span class="eyebrow">The 1820s &ndash; 1890s</span>
  <h1>A family in the hills of the west.</h1>
  <p class="lead">The oldest names we can confirm belong to farming families around Añasco and Lares, in the mountainous western interior of Puerto Rico.</p>
  <p><strong>Máximo Arocho</strong> and <strong>María Ramona Román</strong> were both born in Añasco. Neither their exact birth years nor their own parents have surfaced in any record found so far &mdash; they are, for now, the edge of what can be proven on this branch.</p>
  <p>Their son, <strong>Martín Arocho y Román</strong>, was born around <span class="dates">1828</span>, in a town not yet a year old. He married twice: first to <strong>María Josefa Pérez</strong>, with six children whose names were already forgotten by the time of his death in 1910 &mdash; and second to <strong>Felipa Medina</strong>, with whom he raised at least eleven more children in Lares, among them a son named Guillermo.</p>
  <p>By the 1860s, Lares had grown into exactly the kind of coffee town its founding promised &mdash; and exactly the kind of place where the island's deepest tensions came to a head. On the night of 23 September 1868, a group of planters and reformers marched into Lares and declared Puerto Rico's independence from Spain: the <strong>Grito de Lares</strong>. Spanish troops crushed it within a day. Martín would have been about forty years old, likely still living in or near the town where it happened &mdash; though no record places him at the event itself, and this book doesn't claim one where none exists.</p>
  <p>On the other side of the family, in the same decades, <strong>Juan Rosa Núñez y Bosque</strong> (b. 1858) and <strong>Juana Francisca Méndez Núñez</strong> (b. 1865) were raising their own family, which would eventually connect to Guillermo's line through marriage.</p>
  <div class="who">Family facts confirmed via FamilySearch civil registration &amp; parish records; Martín's own 1910 death certificate was located and read in full. Town history from public sources, cited at the end of this book.</div>`},

{doc:"Isidro and Agustina, Before the Records Begin", html:`
  <span class="eyebrow">Moca, Puerto Rico &middot; around 1780</span>
  <h1>Two names an algorithm guessed right, and a death record that proved it.</h1>
  <p class="lead">Alberto Núñez Acevedo lived a full life in Puerto Rico's western hills &mdash; born around 1805 in Moca, dead 90 years later in Bucarabones, Maricao. For most of this project his own parents existed only as a "Potential" tag: a guess, not a fact, exactly the kind of thing this book has refused to print without a document behind it.</p>
  <p>The document turned up in his own death record. It names his father, <strong>Isidro Núñez</strong>, and his mother, <strong>Agustina Acevedo</strong> &mdash; both born around 1780 in Moca, both now confirmed rather than suggested. They are Omar's <strong>6th great-grandparents</strong>, further back than almost anyone else on this side of the family, and they lived their whole lives as Spanish colonial subjects, decades before Puerto Rico's civil registration system even existed to record people like them directly.</p>
  <p class="lead">Moca in 1780 was barely a town at all &mdash; founded only decades earlier, still mostly forest and scattered subsistence farms in Puerto Rico's northwest hill country, a full day's ride from the port at Aguadilla. Spain governed the island as a military and religious outpost more than a colony worth developing; there was no real cash economy here yet, and the Church's parish register was the only institution that reliably wrote anyone's name down. Isidro and Agustina almost certainly lived and died within a few miles of where they were born, farming small plots of yuca, plantain, and coffee's predecessor crops for their own table rather than for export.</p>
  <div class="who">Death record: Puerto Rico, Civil Registrations, 1885-2001, Alberto Núñez Acevedo (13 Mar 1895, Bucarabones, Maricao), naming Isidro Núñez and Agustina Acevedo as parents. Historical background on colonial-era Moca is public history, not a specific record of this family.</div>`},

{doc:"Six Children, Four Towns, One Set of Parents Agreeing", html:`
  <span class="eyebrow">Moca, Las Marías, Lares &middot; 1834&ndash;1903</span>
  <h1>A family that scattered, one town at a time, into the coffee country their grandchildren would farm.</h1>
  <p class="lead">A later pass through the civil registers found <strong>six children</strong> of Isidro Núñez and Agustina Acevedo, each one confirmed by their own death record naming both parents: Alberto (1805&ndash;1895); <strong>María Clemencia</strong> (1834&ndash;1904, died in Las Marías); <strong>María</strong> (1838&ndash;1898); <strong>María Isidora</strong> (1839&ndash;1889, died in Río Prieto, Lares); <strong>Juana</strong> (1850&ndash;1900, died in Lares &mdash; her record also names her husband, <strong>Mateo Valentín</strong>); and <strong>Felipa</strong> (1858&ndash;1903, died in Las Marías).</p>
  <p>Six births spread across fifty-three years, which almost certainly means Agustina's recorded 1780 birth year is only a rough guess by whoever reported it &mdash; but the parents' names on all six records agree, filed across four different towns and nineteen years of registry books. Isidro and Agustina themselves are still just two names and a birth decade &mdash; no death dates, no record of their own parents, and even FamilySearch's worldwide shared tree, checked directly, has nothing above them. But they're real, not guessed, which is the only thing this book has ever asked of anyone in it.</p>
  <div class="who">Death records: Puerto Rico, Civil Registrations, 1885-2001 &mdash; María Clemencia (8 Jan 1904, Las Marías), María Isidora (12 Mar 1889, Lares), Juana (25 Nov 1900, Lares, naming husband Mateo Valentín), and Felipa Núñez Acevedo (14 Jan 1903, Las Marías), each naming Isidro Núñez and Agustina Acevedo as parents. Sibling set first located via FamilySearch's shared tree (contributor Virginia Piñeiro), then confirmed record-by-record on Ancestry, 2026-07-24.</div>`},

{doc:"A Flag Changes, a Storm Arrives", html:`
  <span class="eyebrow">1898 &ndash; 1899 &middot; setting the scene</span>
  <h1>The island changed twice in one year.</h1>
  <p class="lead">Martín Arocho y Román was about seventy years old when the country he'd lived his whole life in changed flags &mdash; and then very nearly washed away.</p>
  <p>In 1898, following the Spanish&ndash;American War, the United States took control of Puerto Rico from Spain. The following August, the <strong>San Ciriaco hurricane</strong> struck &mdash; it rained for twenty-eight days, roughly 3,400 people died, and the coffee crop that towns like Lares depended on was almost entirely destroyed. It remains one of the deadliest storms in the island's history.</p>
  <p>Guillermo Arocho Medina was born a few years after, into a Puerto Rico still recovering from that storm and newly under American rule &mdash; a very different island than the one his father Martín had been born into in 1828.</p>
  <p>A decade later, the 1910 U.S. Federal Census caught the family at home in barrio La Torre, Lares: Martín, eighty-two, listed as <strong>agricultor</strong> &mdash; a farmer, still working the land at that age &mdash; head of a fifteen-person household that included his much-younger second wife Felipa and children ranging from grown daughters down to a nine-year-old. Felipa and the daughters are recorded as keeping house (<em>quehaceres de casa</em>). It's the only document in this whole book that says, in so many words, what Martín actually did for a living.</p>
  <img class="doc-photo" src="img/martin_arocho_1910_census.jpg" alt="1910 US Federal Census page for Martín Arocho y Román's household, La Torre, Lares, Puerto Rico">
  <div class="doc-photo-cap">1910 U.S. Census, barrio La Torre, Lares, PR</div>
  <div class="who">Historical backdrop, not a specific family record. No document yet found describes how this family weathered the hurricane or the change in government &mdash; only that they were there for both. The 1910 census household detail is a real, cited record: Puerto Rico, Lares, La Torre, District 0381, Sheet 2b.</div>`},

{doc:"A Death in Lares, 1910", html:`
  <span class="eyebrow">10 October 1910 &middot; Lares, Puerto Rico</span>
  <h1>What a death certificate remembered.</h1>
  <p class="lead">Martín Arocho y Román died at eighty-two, and the clerk who recorded it wrote down more than a date.</p>
  <p>The <em>Acta de Defunción</em>, entry number 328, names his parents &mdash; Máximo Arocho and Ramona Román, both "natural de Añasco." It records that he was first married to María Josefa Pérez, with six children whose names the informant could no longer recall. And it names his second wife, Felipa Medina, and the children they raised together: Gregoria, Eusebio, and several more, among them Guillermo.</p>
  <img class="doc-photo" src="img/martin_arocho_death_cert-1.jpg" alt="1910 Acta de Defunción for Martín Arocho y Román, Lares, Puerto Rico">
  <div class="doc-photo-cap">Acta de Defunción, entry 328, Lares, PR &middot; 10 Oct 1910</div>
  <div class="callout"><p>This single document, downloaded and read a century later, is the reason this book knows Martín had a first marriage at all &mdash; a fact that had disappeared from every other record and from family memory.</p></div>
  <p>It is a small thing, an old man's death recorded by a village clerk. It is also the reason any of the rest of this book can be written.</p>`},

{doc:"A Sailor's City, and the Man Who Left It", html:`
  <span class="eyebrow">Cádiz, Spain &middot; abt 1825&ndash;1845</span>
  <h1>Why a man from the oldest port in Europe ended up in the hills of Lares.</h1>
  <p class="lead">Felipa Medina's father, Vicente, is the only person in this whole book who was born in Spain itself &mdash; not a Spanish colony, Spain.</p>
  <p>Cádiz is one of the oldest continuously inhabited cities in Western Europe, founded by Phoenician traders roughly three thousand years before Vicente Medina was born there. By the 1700s it had become something more specific: for most of that century, Cádiz held Spain's legal monopoly on trade with the Americas, after the Crown moved the <em>Casa de Contratación</em> &mdash; the royal house that controlled and taxed all colonial trade &mdash; there from Seville in 1717. Everything Spain shipped to its American colonies, and everything it shipped back, passed through Cádiz's harbor. It was a city built entirely around the ocean: sailors, merchants, shipwrights, customs officers, and the families who depended on all of them.</p>
  <p>By the time Vicente was born, around 1825, that world had cracked open. Between 1810 and 1825, nearly all of Spain's mainland American colonies &mdash; Mexico, Colombia, Venezuela, Peru, Argentina, and the rest &mdash; won their independence. Cádiz's entire reason for existing, moving goods and people to and from a Spanish America, had mostly vanished within a single generation. Puerto Rico and Cuba were now almost the only Spanish territory left in the hemisphere, and Spain leaned on them harder than ever: more soldiers, more administrators, and an open invitation to loyal Spanish subjects to go settle there.</p>
  <p>That invitation had a name and a date: the <strong>Real Cédula de Gracias de 1815</strong>, a royal decree that offered free land and years of tax exemption to Spanish and Catholic foreign settlers willing to relocate to Puerto Rico. It was written to shore up an island Spain suddenly needed to hold onto. It remained in effect, and in practice, for decades afterward &mdash; and Cádiz, as the country's great Atlantic departure point, was exactly where someone from an ordinary maritime family would go to find a ship headed there. A man born into that city's shrinking trade with the Americas, coming of age just as Spain's remaining Caribbean colonies became the place worth going, fits the pattern of who left Cádiz in this period almost exactly: not nobility, not a soldier under orders, but someone from the merchant-and-maritime world the port had run on for a century, following the last part of the Spanish Americas still open to him.</p>
  <p>None of that is a record of Vicente Medina specifically &mdash; no passenger list or land grant for him has yet turned up. What the timeline shows is that his move wasn't unusual; it was the ordinary path for someone in his position at that exact moment in Spanish history. He was in Puerto Rico by 1845 at the latest, when his daughter Felipa was born in Lares. His own death record, decades later, still gave his birthplace as Cádiz &mdash; he never stopped being, on paper, a man from Spain.</p>
  <div class="who">Vicente Medina's birthplace and approximate birth year come from his own Puerto Rico Civil Registrations death record. The history of Cádiz, the collapse of Spanish America, and the Real Cédula de Gracias de 1815 are public history, not specific to this family &mdash; no passenger list, land grant, or emigration record for Vicente himself has been found yet. That search is still open.</div>`},

{doc:"Guillermo & María", html:`
  <span class="eyebrow">10 December 1916 &middot; Lares, Puerto Rico</span>
  <h1>A wedding, and the family it began.</h1>
  <p class="lead">Guillermo Arocho Medina married María Hernández y Núñez in Lares, in the winter of 1916.</p>
  <p>He was Martín and Felipa's son. She was the daughter of Manuel Antonio Hernández and Ricarda Núñez y Méndez, covered on the next page.</p>
  <p>Guillermo and María's marriage record lists him at twenty-two and her at twenty-one &mdash; ages that suggest birth years a few years earlier than the official records elsewhere carry for both of them. It is a small discrepancy, the kind that turns up constantly in century-old paperwork, and this book leaves it unresolved rather than picking a winner.</p>
  <img class="doc-photo" src="img/guillermo_maria_marriage_cert-1.jpg" alt="1916 marriage certificate for Guillermo Arocho Medina and María Hernández y Núñez, Lares, Puerto Rico">
  <div class="doc-photo-cap">Marriage certificate, Lares, PR &middot; 10 Dec 1916</div>
  <p>By 1950, the U.S. Census found Guillermo in Arecibo's La Cruz neighborhood, on Calle Alejandro Salierup &mdash; and not farming, unlike his father before him. He was listed as a <strong>comerciante</strong>, a merchant, running his own small retail store (<em>tienda al detalle</em>), self-employed, fifty-two weeks a year. A generation had turned a farming family into a shopkeeping one.</p>
  <img class="doc-photo" src="img/guillermo_arocho_1950_census.jpg" alt="1950 US Federal Census page for Guillermo Arocho Medina's household, La Cruz, Arecibo, Puerto Rico">
  <div class="doc-photo-cap">1950 U.S. Census, La Cruz, Arecibo, PR</div>
  <p>Together they raised a family in Arecibo: five children lived long enough to be recorded, though two &mdash; Juan Salvador and Roberto &mdash; died in infancy. The rest were José María, Rosa María, and a daughter born the day before Christmas, 1923: <strong>Milagros</strong>.</p>
  <p>Before he was a merchant, and before the wedding, Guillermo registered for the draft twice, twenty-five years apart, and the two cards don't fully agree with each other. His World War I card, filled out in Hatillo, gives his age as twenty-nine, his occupation as <strong>Labrador</strong> &mdash; farm laborer &mdash; and his employer's name as <strong>Sebastián Candelaria</strong>. Worked backward, that age puts his birth around 1888. His World War II card, filled out in Lares twenty-five years later, gives a birth year of 1896 instead &mdash; an eight-year gap between his own two signatures on his own two registration cards. This book doesn't pick a winner between them; birth-year drift like this was common before standardized civil registration, and both cards are equally primary sources, just at odds with each other.</p>
  <p class="lead">Lares in December 1916 would have been cool by island standards &mdash; the mountain interior runs several degrees cooler than the coast, with December among the driest, mildest months of the year, coffee-picking season in full swing across the hillsides around town. A wedding then meant timing it around the harvest as much as around the calendar: coffee was still the region's lifeblood, hand-picked by whole families including children, dried in the sun on wooden platforms called <em>tendales</em> outside nearly every home. Puerto Rico had been under U.S. rule for eighteen years by then, but daily life in a town like Lares &mdash; the language, the Catholic parish at its center, the rhythm of planting and harvest &mdash; had changed far less than the flag over the town hall.</p>
  <div class="who">Guillermo died 13 Nov 1967; María died 10 Apr 1956, Arecibo, buried the next day. Both names are on the Arecibo headstone that started this whole search. U.S., WWI Draft Registration Cards, 1917-1918 (Hatillo, Puerto Rico) and U.S., WWII "Old Man's Draft" Registration Cards, 1942 (Lares, Puerto Rico), both read in full via Fold3.com, 2026-07-24. Historical/seasonal background on Lares is public history, not a specific record of this wedding.</div>`},

{doc:"María's Parents: a Widow's Second Marriage", html:`
  <span class="eyebrow">La Torre, Lares &amp; Aguadilla</span>
  <h1>Eight more children added to a family tree that would one day lead to Omar.</h1>
  <p class="lead">María Hernández y Núñez was the daughter of <strong>Manuel Antonio Hernández</strong> (b. abt 1850, La Torre, Lares &ndash; d. abt 1916, Aguadilla) and <strong>Ricarda Núñez y Méndez</strong> (d. 29 Oct 1936). Ricarda had already lived through one marriage before Manuel Antonio's death, and went on to a second, to Ramón Torres Martínez, adding eight more children to the family tree.</p>
  <p>Manuel Antonio's own parents were <strong>Antonio Hernández</strong> and <strong>Francesca Suárez</strong> (b. abt 1860) &mdash; Omar's mother recognized both names directly from the family's own Ancestry chart, extending the Hernández line one generation further than FamilySearch alone had recorded.</p>
  <div class="who">FamilySearch Family tab for Manuel Antonio Hernández and Ricarda Núñez y Méndez; Antonio Hernández and Francesca Suárez confirmed from the family's own Ancestry chart, recognized directly by Omar's mother.</div>`},

{doc:"Milagros", html:`
  <span class="eyebrow">20 December 1923 &middot; Arecibo, Puerto Rico</span>
  <h1>Milagros is born.</h1>
  <p class="lead">She would live seventy-two years, marry, raise a family in Arecibo, and be buried in the same cemetery her parents already occupied.</p>
  <p>Her sister <strong>Rosa María</strong> married a man named Víctor Cruz and had eight children of her own &mdash; the Cruz cousins, a whole branch of the family that grew up alongside Milagros's own children. Her brothers José María and, briefly, Juan Salvador and Roberto rounded out the household, though the two youngest never made it past infancy, a loss common enough in that era to barely register in the official record beyond a name and two dates a year apart.</p>
  <p>On Christmas Eve, 1942 &mdash; Milagros married. Her husband's name was <strong>Amado Marrero Montalvo</strong>, and his own family had roots in a different part of the island, but a story just as documented as hers.</p>
  <p class="lead">Milagros grew up in an Arecibo remaking itself. The 1920s and '30s brought electricity and paved streets to the town center for the first time, even as the Great Depression hit the island's sugar and coffee economies hard &mdash; Puerto Rico's per-capita income was among the lowest under the American flag through her whole childhood. World War II reshaped everything again just as she came of age: Arecibo's coast became part of the island's coastal defense network, young men left for the war, and rationing touched even food staples like rice and codfish that had defined Puerto Rican tables for generations. Her Christmas Eve wedding in 1942 fell in the middle of that wartime year &mdash; <em>Nochebuena</em> itself, already the biggest night of the Puerto Rican calendar, roast pork and pasteles and parrandas going house to house, made a wedding day that needed no separate celebration built around it.</p>`},

{doc:"The Marrero–Montalvo Line", html:`
  <span class="eyebrow">In parallel, the 1850s &ndash; 1920s</span>
  <h1>Amado's family, growing at the same time.</h1>
  <p class="lead">While Guillermo and María's family took shape in Lares and Arecibo, Amado's parents were building a life of their own.</p>
  <p><strong>Juan Ramón Marrero</strong> (b. 1883) married <strong>María Montalvo Ramos</strong> (b. 15 Jun 1896, Utuado) in Arecibo, 1920. Juan Ramón's own parents were <strong>Juan MARRERO Gonzalez</strong> (b. abt 1861, Camuy &mdash; d. 30 Dec 1899, Arecibo, age 38) and <strong>Carmen Evarista Medina y Ramos</strong> (b. 1863). María's parents were <strong>Domingo Aquilino Montalvo Dominguez</strong> (b. 17 Nov 1878, Sabana Hoyos, Arecibo &mdash; d. Oct 1970, Miraflores, Arecibo) and <strong>Dionicia Ramos Santiago</strong> (b. 11 Apr 1876 &mdash; d. 29 Apr 1972, both Sabana Hoyos/Miraflores, Arecibo), married in Arecibo on 22 March 1901 and went on to raise nine children of their own. María herself is the best-documented person in this entire tree &mdash; five census records spanning 1910 to 1950, a death record, and a 1928 passenger list naming the ship she sailed on, the <em>Coamo</em>.</p>
  <p>Amado was born 11 May 1924, in Arecibo &mdash; the same city where, eighteen years later, he would marry Milagros.</p>
  <p><strong>A generation further back, found this year:</strong> Juan MARRERO Gonzalez's own 1899 death record &mdash; a handwritten Acta de Defunción from the Villa de Arecibo &mdash; named his parents too, though the clerk's hand garbled both names on the transcription: "Bede Marrero" and "Leturia Gonzalez." A second, independent Ancestry researcher's tree had the same couple recorded cleanly: <strong>Pedro Marrero</strong> and <strong>Petunia?? González</strong>, both of Camuy &mdash; read together, the two sources resolve each other. Pedro had at least two wives: Petunia's son was Juan (Amado's line); a second wife, <strong>Mercedes González</strong>, gave him a second son, <strong>Miguel Marrero González</strong> (1866&ndash;1951) &mdash; not a direct ancestor, but tracked in full below because his own household turned out to be extraordinarily well documented. Pedro and Petunia's own parents aren't in any record found yet; a non-primary tree names Pedro's fuller name as "Pedro Eloy Marrero y Nieves," which would explain where an earlier, mistaken version of this chapter got the name "Pedro Marrero Nieves" &mdash; but no primary document backs that fuller name, so it's noted here as an open lead, not a fact.</p>
  <div class="who">This side of the family extends two generations further back than confirmed on the Arocho/Hernández side. Juan MARRERO Gonzalez and Carmen Evarista Medina y Ramos, and Domingo Aquilino Montalvo Dominguez and Dionicia Ramos Santiago, are Amado's great-grandparents; Pedro Marrero and Petunia?? González, confirmed 2026-07-24 via Juan's own 1899 Puerto Rico Civil Registration death record (Ancestry image ref: dbId 9100, image 004494273_02879) corroborated by the Rodriguez Espinosa Family Tree, are Amado's 3rd-great-grandparents. Full transcriptions saved at records/marrero-montalvo/pedro_marrero_petunia_gonzalez_2026-07-24.txt.</div>`},

{doc:"Miguel Marrero González's Household, Four Censuses Deep", html:`
  <span class="eyebrow">Zanja, Camuy, 1910&ndash;1940</span>
  <h1>The half-brother nobody had looked for turned out to be the best-documented man in the branch.</h1>
  <p class="lead">Miguel Marrero González (1866&ndash;1951), Juan Ramón's half-brother, is not a direct ancestor &mdash; but nobody had gone looking for him before, so his record trail sat untouched, and it turned out to be extraordinary. His 1951 death record (age 85, Camuy) names his parents as Pedro Marrero and Mercedes González, confirming Pedro's second marriage directly.</p>
  <p>He married <strong>María Salicrup</strong> (b. abt 1875, Puerto Rico) and the two of them show up, together, in the same barrio of Zanja, Camuy, in <strong>four consecutive U.S. Federal Censuses</strong> &mdash; 1910, 1920, 1930, and 1940 &mdash; a farmer's household tracked across thirty straight years. Their five children, born between 1902 and 1911 &mdash; Dorotea, Selina, Silvia, Rogelia, and Lorenzo &mdash; turned out to be five separate daughters and a son, not census-taker misspellings of the same person as first suspected. The 1910 and 1940 censuses both record the household's race as <strong>"White"/"Blanco."</strong> María outlived Miguel; the 1920 census lists her occupation as "modista" &mdash; a seamstress.</p>
  <div class="who">Miguel Marrero González's household confirmed via his own 1951 death record and the 1910/1920/1930/1940 U.S. Federal Censuses, 2026-07-24/25.</div>`},

{doc:"Silvia, Lorenzo, and Rogelia — Traced Forward", html:`
  <span class="eyebrow">Camuy, 1931&ndash;1989</span>
  <h1>Three of Miguel's five children, followed to the end of their lives.</h1>
  <p class="lead">Chasing Miguel and María's five children forward turned up a small, quiet history. <strong>Silvia</strong> married <strong>Francisco López Espiet</strong> in Camuy on 27 August 1931 &mdash; which is why she appears in the 1940 census carrying the name "Silvia Marrero Vda de López," widow of López, back living in her father's house at thirty-two.</p>
  <p><strong>Lorenzo</strong>, the only son, lived to sixty-seven, dying in Camuy on 15 June 1975; his own death record names Miguel and María as his parents, closing the loop on him directly. <strong>Rogelia</strong> lived the longest of the five, to eighty-seven, dying in Camuy on 21 August 1989 &mdash; also confirmed by her own death record naming both parents.</p>
  <p>None of the three death/marriage records found for this family name a surviving child. If this branch has living descendants today, they haven't surfaced in any record searched so far.</p>
  <div class="who">Silvia's 1931 marriage record, Lorenzo's 1975 death record, and Rogelia's 1989 death record, all Puerto Rico Civil Registrations, 1885-2001, found and confirmed 2026-07-25.</div>`},

{doc:"Selina and Dorotea — Where the Trail Stops", html:`
  <span class="eyebrow">Camuy, after 1940</span>
  <h1>Two sisters who vanish from the record after childhood.</h1>
  <p class="lead"><strong>Selina</strong> and <strong>Dorotea</strong> Marrero Salicrup, the remaining two of Miguel and María's five children, vanish from the record after their early-life census entries. Neither a marriage nor a death record has been found for either one.</p>
  <p>A promising-looking lead for Dorotea &mdash; a "Dorotea Marrero" married to a "Lorenzo" &mdash; turned out, on inspection, to belong to an entirely different family with no matching parents. Rejected rather than forced into place. This is what an honest dead end looks like in this project: not a wrong guess accepted, but a real search that came up empty.</p>
  <div class="who">1910/1920/1930/1940 U.S. Federal Censuses, Zanja, Camuy; direct-collection searches of Puerto Rico, Civil Registrations, 1885-2001, 2026-07-25 — no matching records found.</div>`},

{doc:"Reading the Old Handwriting", html:`
  <span class="eyebrow">Arecibo, 1819 &ndash; 1892</span>
  <h1>Two more generations, found in a book that hasn't been opened in over a century.</h1>
  <p class="lead">The Montalvo line goes back further than anyone realized &mdash; and the proof was sitting in a leather-bound death register in Arecibo, in Spanish, in handwriting no algorithm was ever going to transcribe correctly on its own.</p>
  <p>Domingo Aquilino Montalvo Dominguez's own father, <strong>Hilario Montalvo y Centeno</strong> (1850&ndash;1900), turned out to have a death record of his own &mdash; and it named <em>his</em> parents: <strong>Nicolás Montalvo Núñez</strong> (b. abt 1819, Arecibo &ndash; d. 13 Jan 1892, barrio Sabana, Arecibo, of pneumonia, age 73) and <strong>Tomasa Centeno</strong>. That's Amado's 5th-great-grandfather, born back when Puerto Rico was still under Spanish colonial rule.</p>
  <p>Reading Nicolás's own death certificate directly &mdash; not a transcription, the actual 1892 handwritten Spanish &mdash; turned up something nobody had recorded anywhere: Nicolás had been married <em>twice</em>. Tomasa Centeno was his first wife; they had two children, Hilario and a previously unknown sister, <strong>Catalina</strong>. After Tomasa, he remarried <strong>Higinia Rodríguez</strong> and had eight more children &mdash; half-siblings to Hilario, born into a branch of the family nobody had traced before: María Justa, Romualdo, Juliana, Francisco, Juan José, Concepción, Juan, and Francisca.</p>
  <p>A second, completely independent record &mdash; the 1885&ndash;87 death certificate of a man named <strong>Juan Tomás Montalvo Núñez</strong>, found by searching Arecibo's records directly rather than waiting on a hint &mdash; turned out to name the same parents again: a man named <strong>Valentín Montalvo</strong> and a woman named <strong>Juliana Núñez</strong>. That's Nicolás's own father and mother, confirmed twice over by two unrelated documents about two different sons. Juan Tomás, unmarried, a day laborer, died of asphyxia in barrio Miraflores &mdash; another previously unknown brother of Nicolás, and one more branch of this family that had simply never been looked for before.</p>
  <div class="who">Nicolás Montalvo Núñez and Tomasa Centeno confirmed via Nicolás's own 1892 Arecibo death certificate, read directly from the original Spanish. Valentín Montalvo and Juliana Núñez (Amado's 6th-great-grandparents on the Montalvo side) confirmed independently by two separate death records: Nicolás's (1892) and his previously-undocumented brother Juan Tomás's (1885&ndash;87). Valentín's own parents are not yet found in any record &mdash; PR's civil registration only starts in 1836, so going further back will mean searching Arecibo's Catholic parish baptismal records instead. <strong>Unresolved discrepancy (2026-07-22):</strong> a separate 1887 birth registration for Hilario's son Juan Montalvo y Rodríguez names Hilario's parents as "Nicolás Montalvo" and "Encarnación Centeno" &mdash; same names as here except the wife's first name (Encarnación vs. Tomasa). Both records are real and both are cited; this book doesn't pick a winner. Possibly Nicolás had two wives named Centeno, or one record has a transcription error &mdash; needs the original parish/civil images compared side by side to resolve.</div>`},

{doc:"Thelma", html:`
  <span class="eyebrow">27 September 1943 &ndash; 14 September 2019</span>
  <h1>A daughter, and a family that would scatter.</h1>
  <p class="lead">Milagros and Amado's first surviving child was a daughter, Thelma, born in Arecibo. In 1950 she was six years old, living in her grandmother María Montalvo Ramos's household on Calle José Leonoron in the San Felipe barrio &mdash; the same address María herself is recorded at that year, three generations under one roof.</p>
  <p>Amado's own life did not stay in Puerto Rico. His marriage to Rosa Ceballo Marrero, in Manhattan in 1950, falls right at the start of what's remembered as the <strong>Great Migration</strong> &mdash; between 1950 and 1960, roughly 470,000 Puerto Ricans, a fifth of the island's population, left for the mainland, most of them for New York City. The 1917 Jones Act had already made every Puerto Rican a U.S. citizen, free to travel without a visa; postwar factory jobs and, by the 1950s, cheap air travel did the rest. By 1950, four out of five mainland Puerto Ricans lived in New York.</p>
  <p>Amado appears to have been part of that wave. By the time he died in 1982, it was in Oceanside, on Long Island, New York, far from the Arecibo he was born in. He is buried in Roosevelt, New York &mdash; one of hundreds of thousands of that same migration, most of whom never came home.</p>
  <p>Milagros stayed. She died in Arecibo in 1996, seventy-two years old, and was buried that August in Cementerio Privado La Santa Cruz &mdash; the same plot as her parents and her sister. It is the grave that started this entire search.</p>
  <p>Thelma's own life moved between three marriages and two countries. Her daughter, <strong>Yadyra Cardona</strong>, was born in 1959 to Thelma and <strong>Miguel Cardona</strong>. Later, Thelma married <strong>Richard Broadbent</strong>, with whom she had two more children, Eric and Paris &mdash; Yadyra's half-brothers. By the early 1980s Thelma had moved to El Paso, Texas, where on 21 September 1982 she married a third time, to <strong>Ruben Garcia</strong>. By the mid-1990s she had settled on Long Island &mdash; Freeport, then Bellmore, then Rockville Centre &mdash; where she lived until her death in Mineola in 2019, seventy-five years old.</p>
  <p class="lead">El Paso in the early 1980s was a border boomtown, its population climbing past 400,000 for the first time, Fort Bliss and a growing garment and electronics industry pulling people in from across Texas, Mexico, and beyond. It was a strange landing spot for a Puerto Rican family, an overwhelmingly Mexican-American city where the second language on every sign was the same Spanish Thelma had grown up speaking, just a different accent, a different history behind it. Summers there run brutally dry and over 100&deg;F, a world away from San Felipe's tropical humidity or the gray Atlantic winters she'd later settle into on Long Island &mdash; three marriages, three very different climates, one woman moving through all of them.</p>
  <div class="who">Amado's New York dates and burial place are confirmed on FamilySearch. Thelma's birth, 1950 census household, El Paso residence, and marriage to Ruben Garcia are confirmed by U.S. federal census records, Texas marriage indexes, and public records indexes. The Great Migration context is documented public history, not a specific record of why the family went &mdash; but the timing lines up with it closely. El Paso background is public history, not a specific record of Thelma's life there.</div>`},

{doc:"Yadyra & Juan José", html:`
  <span class="eyebrow">28 September 1946 &middot; Bogotá, Colombia</span>
  <h1>The man who would become your father.</h1>
  <p class="lead">Juan José Huertas Vargas was born in Bogotá, Cundinamarca, Colombia &mdash; not Puerto Rico. His is an entirely separate migration story, layered onto this one only by his marriage.</p>
  <p>His parents were <strong>Juan José Huertas</strong> and <strong>Beatriz Vargas y Rosa de Huertas</strong> (1922&ndash;2013). Beyond their names, almost nothing about that side of the family has surfaced yet &mdash; no birth, marriage, or Colombian civil record has been found for either of them, only the family-tree entries themselves. What is known about Juan José himself comes almost entirely from a single document: the service card printed for his funeral, on 27 November 2021, four days after he died at seventy-five in Florida.</p>
  <img class="doc-photo" src="img/juan_jose_huertas_funeral_card.jpg" alt="Funeral service card for Juan José Huertas Vargas, November 2021">
  <div class="doc-photo-cap">Funeral service card &middot; 27 Nov 2021, Florida</div>
  <p>He married Yadyra Cardona &mdash; Thelma's daughter, three generations removed from the wedding in Lares in 1916, four from the death certificate that first named Máximo Arocho. Yadyra's own father, <strong>Miguel Cardona</strong>, was the son of <strong>Miguel Cardona Reyes</strong> and <strong>Iraida Cruz Santiago</strong> &mdash; a line confirmed by the family directly rather than by document, and the shallowest-known branch of this entire tree.</p>
  <p class="lead">Bogotá in September 1946, at 8,600 feet in the Andes, would have greeted Juan José's birth with the same cool, thin, rainy-season air the city has year-round &mdash; no real seasons, just wet months and slightly-less-wet ones, and September sits deep in the second of the city's two rainy stretches. The Colombia he was born into was two years from <em>La Violencia</em>, the decade of political bloodshed between Liberals and Conservatives that would soon send hundreds of thousands of rural Colombians fleeing into cities like Bogotá; the capital itself was already swelling with migrants, its streetcars and tiled colonial center giving way, block by block, to the modern city growing around it.</p>
  <div class="who">Birthdate/birthplace and parents' names sourced from the Ancestry family tree, not yet an opened Colombian civil or church record &mdash; that search is still open. Everything else on this page comes from the funeral card and the family's own confirmation. Bogotá climate and historical background is public history, not a specific record of this birth.</div>
  <div class="callout"><p>Everything in this book, every record and every name, exists to answer one question: who were the people whose lives, one after another, led to this marriage &mdash; and to the child it produced.</p></div>`},

{doc:"The Oldest Name We Have", html:`
  <span class="eyebrow">Arecibo, 9 September 1894</span>
  <h1>A death certificate that reaches back before 1800.</h1>
  <p class="lead">On the Montalvo side of Amado's family, one more document pushed the line back further than anywhere else in this book &mdash; to a man who was likely born under Spanish colonial rule in the 1780s.</p>
  <p>María Rodríguez y Rodríguez &mdash; Hilario Montalvo y Centeno's wife &mdash; had her own parents named in a Puerto Rico civil death registration: <strong>Juan Antonio Rodríguez y Reyes</strong>, who died in Arecibo on 9 September 1894 at eighty-five years old, meaning he was born around 1809. His wife was <strong>Mercedes Rodríguez</strong>. The same document, naming Juan Antonio's own parents for the informant's record, gives us <strong>Valentín Rodríguez</strong> and <strong>Rosa Reyes</strong> &mdash; old enough, if Juan Antonio was born in 1809, to have themselves been born in the 1780s.</p>
  <p>No birth, marriage, or death record for Valentín or Rosa themselves has turned up. They exist in this book only as two names on their son's death certificate &mdash; but they are, for now, the oldest confirmed people in the entire family tree, a full generation earlier than Martín Arocho y Román's 1828 birth in Lares.</p>
  <div class="who">Juan Antonio Rodríguez y Reyes's death registration (Puerto Rico, Civil Registration, 1805-2002, FamilySearch ARK 1:1:QVJ3-7C3B) names both his wife and his own parents. Valentín Rodríguez and Rosa Reyes are named only on this one document; no independent second source has been found for them.</div>`},

{doc:"Beatriz's Side: a Card from 1952", html:`
  <span class="eyebrow">Bogotá, Colombia</span>
  <h1>One document, and a line that ends where it starts.</h1>
  <p class="lead">Juan José Huertas Vargas's mother, <strong>Beatriz Vargas y Rosa de Huertas</strong>, appears on her own 1952 Colombian background-check card: born 12 September 1922 in Bogotá, married, parents <strong>Luciano Vargas</strong> and a mother recorded only by her surname, <strong>Pineda</strong>. No further record for either of them has surfaced &mdash; this is where that line currently ends.</p>
  <div class="who">Colombia, DAS Civil Registration Alphabetic Cards, 1914-2011 (FamilySearch ARK 1:1:65W7-7BZF) &mdash; her own record names her parents directly, confirmed.</div>`},

{doc:"A Text Message Settles What Months of Archives Couldn't", html:`
  <span class="eyebrow">Bogotá, Colombia &middot; a separate world</span>
  <h1>The missing piece wasn't in an archive. It was in a phone Omar's uncle was still holding.</h1>
  <p class="lead">Juan José Huertas Vargas's father's own identity turned out to be the real puzzle on this branch. The tree had always carried him as "Juan José Huertas" &mdash; but there was no document behind that name at all, not even a birth year. A name search had long ago turned up a Bogotá couple, a <strong>José Manuel Huertas</strong> and a <strong>Clementina Castiblanco</strong>, real and documented in their own right, matching the right town and the right generation &mdash; but with nothing that actually stated the relationship, this book held the line and left them out.</p>
  <p class="lead">Then Omar asked his uncle Pablo &mdash; one of nine children himself, Domingo Huertas's own grandson &mdash; who all his brothers and sisters were. Pablo answered from memory, in a text message, in under a minute: parents <strong>José Manuel Huertas</strong> and <strong>Beatriz Vargas</strong>. The exact name this book had been sitting on, unconfirmed, for weeks.</p>
  <p>That single message did more for this branch than months of archive searching. It confirmed the father's real name outright. It meant the previously-unconfirmed Bogotá couple &mdash; José Manuel Huertas, born 15 May 1921 in Anolaima, died 27 June 1960 in Bogotá, son of Domingo Huertas &mdash; really was Omar's great-grandfather, and that Clementina Castiblanco, verified independently by a second researcher's tree, really was his great-grandmother. And it named three more of Omar's great-aunts and great-uncle who had no record anywhere in this project before now: <strong>Helena Sofia</strong>, <strong>Víctor Manuel</strong>, and <strong>Ana Dolores Huertas</strong>, joining the six already known &mdash; Héctor Manuel, Ana Graciela ("Chelita"), Luis Guillermo, Juan José (Omar's father), Pedro Pablo, and Luis Jaime. Nine children in total, the fullest sibling group recorded anywhere in this book.</p>
  <p>This is the branch that had blocked this project the longest &mdash; Puerto Rico's records go back to 1885 and Spain's parish books further still, but Colombia's paper trail, for this specific family, simply ran out.</p>
  <div class="who">José Manuel Huertas's identity confirmed by family testimony (Pablo Huertas, Omar's uncle, direct message to Omar, 2026-07-24) matching an independently-sourced Ancestry hint (Huertas Family Tree) naming his birth, death, father Domingo Huertas, and mother Clementina Castiblanco; Clementina further corroborated by a second, separately-owned Acevedo Family Tree. Three siblings (Helena Sofia, Víctor Manuel, Ana Dolores) added from the same family testimony.</div>`},

{doc:"Domingo Huertas's Sons, Found in Bogotá's Burial Permits", html:`
  <span class="eyebrow">Bogotá, 1976&ndash;1980</span>
  <h1>Three great-uncles no one mentioned, found by going straight to the archive.</h1>
  <p class="lead">Domingo Huertas himself &mdash; José Manuel's father, Omar's 2nd-great-grandfather &mdash; turned out to have more children than the tree had ever recorded. Bogotá's own burial permit records surfaced three more of his sons: <strong>Miguel Huertas Castiblanco</strong> (1914&ndash;1977), <strong>Reyes Huertas Castiblanco</strong> (1926&ndash;1976), and <strong>Abelardo Huertas Castiblanco</strong> (1928&ndash;1980) &mdash; great-uncles of Omar's, none of them mentioned anywhere before this project went looking directly in Bogotá's burial-permit archive rather than waiting for a hint to surface them.</p>
  <div class="who">Miguel, Reyes, and Abelardo Huertas Castiblanco confirmed via Bogotá Burial Permits, FamilySearch, 2026-07-24.</div>`},

{doc:"A Death Certificate Answers a Question", html:`
  <span class="eyebrow">Arecibo, 27 July 1942</span>
  <h1>The document that finally named Miguel Cardona Reyes's parents.</h1>
  <p class="lead">For most of this project, Miguel Cardona Reyes's parents existed only as an algorithm's guess &mdash; a "Potential father" and "Potential mother" tag that this book's own rule said not to trust. Then his death certificate turned up.</p>
  <p>Miguel died in Arecibo on 27 July 1942, at twenty-two. His <em>Certificado de Defunción</em> states plainly, in the clerk's own hand: father <strong>Ramón Cardona</strong>, mother <strong>Catalina Reyes</strong>. No guessing, no matching software, no stranger's tree &mdash; the record itself names them, which is exactly what this project has insisted on from the start.</p>
  <p>It didn't stand alone. A 1930 census had already shown a ten-year-old "Miguel Colón y Reyes" living in a household headed by Catalina Reyes y Rivera, alongside siblings Tomás, Cándido, Daniela, and Francisca &mdash; recorded under a different surname than the one Miguel used later, which had been reason enough to hold off. His World War II draft card, filled out five months before he died, closed that gap: it lists his next of kin as "Tomás Colín" &mdash; the same brother, now on paper, tying the Colón household directly to the Cardona name Miguel carried as an adult.</p>
  <p>Between one death certificate and one draft card, a line that had been stuck for the whole project became four generations deep: <strong>Ramón Cardona Estela</strong> and <strong>Catalina Reyes Rivera</strong>, parents of <strong>Miguel Cardona Reyes</strong> (1920&ndash;1942), father of <strong>Miguel Cardona</strong> &mdash; Yadyra's father, and Omar's grandfather.</p>
  <p class="lead">Miguel filled out that draft card in February 1942, two months after Pearl Harbor, when every Puerto Rican man of age was suddenly registering for a war the island had no say in joining. He was dead by July, at twenty-two &mdash; the record doesn't say why, and this book won't guess.</p>
  <div class="who">Death record: Puerto Rico, Civil Registrations, 1885-2001, Arecibo Defunciones 1941-1943. Household: 1930 & 1935 U.S./Puerto Rico census schedules. Draft card: U.S., World War II Draft Cards Young Men, 1940-1947. Background on 1942 conditions is public history, not a specific record of Miguel's cause of death, which remains unknown.</div>`},

{doc:"Ramón and Catalina, One Generation Back", html:`
  <span class="eyebrow">Arecibo, 1918&ndash;1930s</span>
  <h1>A marriage record, a remarriage, and two children no one had recorded.</h1>
  <p class="lead">Ramón Cardona Estela's own trail went one generation further in 2026: his 1930 census matched the household already on file, and his own marriage record to Catalina Reyes Rivera &mdash; 9 September 1918, Arecibo &mdash; named his mother directly: Felipa Cardona Estela, Omar's 3rd-great-grandmother on this side. One loose thread remains open: three separate, independent records all name a "Ramón Cardona <em>Ramírez</em>," born a year or two off, in a different town, with a different spouse &mdash; possibly the same man under a mistranscribed surname, possibly someone else entirely. The primary record already names his mother, so this book isn't guessing either way; it's simply noting the discrepancy.</p>
  <p>Catalina Reyes Rivera outlived Ramón, and her own record trail didn't stop with his death. A household match in the 1930s named two more children never before recorded &mdash; <strong>Lucía Cruz Y Reyes</strong> and <strong>Cándido</strong> &mdash; siblings to Miguel, Tomás, Daniela, and Francisca. And a later census caught something the family had never written down anywhere: Catalina had remarried, to a man named <strong>Fabián García</strong>, which is why some records carry her as "Catalina Reyes, Vda. García" &mdash; widow of García.</p>
  <p>Catalina's own parents surfaced the same way Ramón's did: <strong>Luis Reyes y Cruz</strong> (abt 1852 &ndash; 3 Oct 1911) and <strong>Gumercinda Rivera Cruz</strong> (10 Nov 1856 &ndash; 11 Sep 1896), Omar's 6th-great-grandparents on this side. Their own records turned up three siblings for Catalina never recorded before &mdash; <strong>Manuel</strong> (b. 1889), <strong>Baltazar</strong> (abt 1884 &ndash; 1972), and <strong>Angela Reyes Rivera</strong> (b. 1895) &mdash; each confirmed by a separate record.</p>
  <div class="who">Ramón Cardona Estela's marriage record and 1930 census, Puerto Rico Civil Registrations & U.S. Federal Census, confirmed 2026-07-23. Catalina Reyes Rivera's hint sweep (children, remarriage, parents), Ancestry.com, confirmed 2026-07-23.</div>`},

{doc:"Felipa's Generation, Three Independent Records Deep", html:`
  <span class="eyebrow">Arecibo, back to 1830</span>
  <h1>The best-sourced woman on this whole branch.</h1>
  <p class="lead">Felipa Cardona Estela's own trail went one generation further still. Her death record &mdash; 4 August 1935, Arecibo &mdash; names her parents directly: <strong>Javier Cardona</strong> (b. abt 1835) and <strong>Leonor Estela</strong> (1830&ndash;1885, Arecibo), Omar's <strong>4th-great-grandparents</strong> on the Cardona line. Leonor's own record is the best-sourced person on this branch yet &mdash; three separate, independent Puerto Rico civil registration entries all point to the same woman, not just one document standing alone.</p>
  <p>A 1930 census also caught Felipa, widowed at 70, still head of her own household in Arecibo, living with her son Ramón and a young man named <strong>Cándido Cardona</strong> &mdash; almost certainly her grandson, not one more child of hers at 70, so he's noted here rather than added to her own family line.</p>
  <div class="who">Felipa Cardona Estela's own death record (Puerto Rico, Civil Registrations, 1885-2001, 4 Aug 1935) and 1930 census; Leonor Estela confirmed by three independent Puerto Rico Civil Registration entries; Javier Cardona confirmed via the same death record, cross-referenced against a secondary Quiles Altieri family tree; all confirmed 2026-07-23.</div>`},

{doc:"Gumercinda's Parents, and the Deepest Generation in This Book", html:`
  <span class="eyebrow">Arecibo, San Germán, Lajas &middot; the 1800s</span>
  <h1>A rejected lead becomes a new standard, and the trail runs out at five greats.</h1>
  <p class="lead">Gumercinda's own death record reached exactly as far as it could: it names her parents as <strong>Cándido Rivera Y Cancel</strong> and <strong>Inés Cruz Y Ramirez</strong>, Omar's 4th-great-grandparents on the Reyes/Rivera side. Luis Reyes y Cruz's own parents surfaced too, but only through a non-primary family tree naming Manuel Cruz y Santiago and Gregoria Rodriguez y Beltran; no primary document has confirmed them yet, so this book leaves them out of the family line for now.</p>
  <p class="lead">Cándido's own trail went one generation further still, and getting there took an extra step this book hadn't needed before: an earlier lead on a different branch of this same tree &mdash; a "Pedro P. Vargas Castro," offered up by a stranger's public tree as Juan Casiano Vargas Lebrón's father &mdash; had just been caught and rejected when its actual attached death record turned out to name a completely different spouse than the tree claimed. That catch became the new standard. So when Cándido's own death record surfaced <strong>Julián Rivera</strong> and <strong>María Cancel</strong> as his parents, this book didn't take the tree's word for it &mdash; it opened both of their own death records directly. Both held up.</p>
  <p><strong>Julián Rivera Cruz</strong> (d. 10 July 1886, Arecibo) and <strong>María Belén Cancel Pagán</strong> (b. 1803, Lajas &ndash; d. before 1886, San Germán) are Omar's <strong>5th-great-grandparents</strong> &mdash; the deepest generation reached anywhere in this book by direct descent. Along the way, Inés Cruz Ramírez's own record turned up one more previously-unrecorded sibling for Gumercinda: <strong>Joaquín Rivera Cruz</strong>, found only because his own WWI draft card named his mother.</p>
  <div class="who">Gumercinda Rivera Cruz's own death record (Puerto Rico, Civil Registrations, 1885-2001, 11 Sep 1896) naming parents Cándido Rivera Y Cancel and Inés Cruz Y Ramirez; Luis Reyes y Cruz's 1910 census and own death record; Social Security Applications and Claims Index for Angela Reyes Rivera; Cándido Rivera Cancel's own 1892 death record naming parents Julián Rivera and María Cancel; Julián Rivera's own 1886 death record; María Belén Cancel Pagán's own death record naming spouse and child directly; Inés Cruz Ramírez corroborated by her son Joaquín Rivera Cruz's WWI draft card; all confirmed 2026-07-23/24.</div>`},

{doc:"Miguel Cardona Reyes, Twenty-Two Years", html:`
  <span class="eyebrow">Arecibo, 1920&ndash;1942</span>
  <h1>A whole life, folded into two documents and twenty-two years.</h1>
  <p class="lead">Most of the people in this book left behind decades of records &mdash; censuses that catch them at six different ages, marriage licenses, Social Security files, obituaries written by people who knew them for a lifetime. Miguel Cardona Reyes left behind a death certificate and a draft card, five months apart, and almost nothing else. This page exists because a life that short still deserves its own page, not just a paragraph inside someone else's chapter.</p>
  <p>He was born in Arecibo in 1920, one of at least six children &mdash; Miguel, Tomás, Cándido, Daniela, Francisca, and Lucía &mdash; raised by Catalina Reyes Rivera in a household that, for reasons no surviving record explains, carried the surname Colón rather than his father's name, Cardona. The 1930 census caught him as "Miguel Colón y Reyes," age ten, one child among several in his mother's house. Whatever the reason for the different name &mdash; an informal separation from his father Ramón, a common enough practice in the era, or something else entirely &mdash; it held for at least a decade of his childhood.</p>
  <p>By February 1942, he was going by Miguel Cardona Reyes, and the world had just gone to war. He filled out his World War II draft card that month, two months after Pearl Harbor, giving his address, his employer, a physical description now faded on the microfilm, and the name of his next of kin: his brother, "Tomás Colín" &mdash; the same brother from the 1930 household, under the same alternate surname, which is the single detail that let this project connect the grown man back to the boy in his mother's house.</p>
  <p>Five months later, on 27 July 1942, he was dead at twenty-two. His death certificate is the only document that names his parents outright &mdash; father Ramón Cardona, mother Catalina Reyes &mdash; and it does not say how he died. This book has been careful throughout not to guess at causes of death it can't source, and it won't start here. What can be said honestly is context, not diagnosis: 1942 Puerto Rico had no civilian access to penicillin, tuberculosis was still a leading cause of death on the island, and a twenty-two-year-old could be gone within days of an infection that would be routine to treat today. Arecibo in late July sits deep in hurricane season, and the war that had just pulled every young man on the island into registering for the draft was, for most of them, still a radio broadcast rather than a battlefield. Miguel registered for a war he never had the chance to fight in.</p>
  <p>He left one child: <strong>Miguel Cardona</strong>, Yadyra's father and Omar's grandfather, still living. Everything this project has since learned about the Cardona line &mdash; back through Ramón Cardona Estela and Catalina Reyes Rivera, to Felipa Cardona Estela and Javier Cardona and Leonor Estela, to Luis Reyes y Cruz and Gumercinda Rivera Cruz and, past her, to Cándido Rivera Y Cancel and Inés Cruz Y Ramirez &mdash; exists because two clerks, one filling out a draft card and one filling out a death certificate five months apart in 1942, wrote down a few names correctly. Four more generations, recovered from a life that lasted twenty-two years.</p>
  <div class="who">1930 United States Federal Census (household of Catalina Reyes y Rivera, Arecibo). U.S., World War II Draft Cards Young Men, 1940-1947 (Miguel Cardona Reyes, Feb 1942, naming next of kin Tomás Colín). Puerto Rico, Civil Registrations, 1885-2001 (death record, 27 Jul 1942, Arecibo, naming parents Ramón Cardona and Catalina Reyes). Background on wartime and public-health conditions in 1942 Puerto Rico is public history, not a specific record of Miguel's own cause of death, which remains unknown and unguessed-at by design.</div>`},

{doc:"Iraida's Papers", html:`
  <span class="eyebrow">Arecibo to Brooklyn to Hart Island</span>
  <h1>A life traced through the paperwork of being an immigrant.</h1>
  <p class="lead">Yadyra's grandmother on the Cardona side, Iraida Cruz Santiago, left behind more paper than almost anyone else on this side of the family &mdash; not because her life was unusually documented, but because she lived it entirely inside the American paperwork system: Social Security, passenger lists, public records indexes.</p>
  <p>Her own birth record, an <em>Acta de Nacimiento</em> from Arecibo dated 20 November 1925, names her mother, Dolores Santiago, and no father at all &mdash; the space on the document simply wasn't filled in. Her Social Security application, filed decades later and updated as her name changed over the years (Cruz Marin, then just Marin), names a father: <strong>Eleuterio Cruz</strong>. It's self-reported, not a birth record, but it's the strongest evidence yet for a name that had only existed before as an algorithm's guess.</p>
  <p>Dolores herself shows up five years later, in the 1930 census: about twenty-eight years old, still in Arecibo, living on her own rather than as an entry on someone else's page. It's a small thing &mdash; one line in a census taker's book &mdash; but it's the first record of Dolores as a person in her own right, not just "mother" on her daughter's paperwork.</p>
  <p>A different, unrelated stranger's public tree claims her father was someone else entirely &mdash; Juan B. Colón Pérez. Both claims are recorded here. Neither is resolved.</p>
  <p>Iraida died in New York in October 1998 and was buried on <strong>Hart Island</strong>, in the Bronx &mdash; New York City's public cemetery, still in use today for residents who die without family able to claim them or pay for a burial. It is a detail no one in the family had known, and one that says something true and a little heartbreaking about how far from Arecibo her life had carried her by the end.</p>
  <p class="lead">Whenever Iraida made the move north, she joined one of the largest population shifts in Puerto Rican history &mdash; hundreds of thousands crossing from the island to New York across the middle of the twentieth century, most landing first in neighborhoods like the Lower East Side, the South Bronx, or Brooklyn's Williamsburg and Bushwick, where Spanish-language churches, bodegas, and social clubs sprang up to hold pieces of the island in place. It was a harder landing than the postcards suggested: cold winters none of these families had ever prepared for, factory and garment-district jobs that paid poorly and demanded long hours, and a city that didn't always distinguish between Puerto Rican citizens and other, less-welcomed immigrants. Hart Island itself has held New York's unclaimed dead since 1869 &mdash; prisoners from Rikers used to dig the graves, and burials there happen in unmarked trenches, a hundred or more to a section. It is the ending of an old, particular kind of American story: someone who came for opportunity and, in the end, had no one nearby to claim her.</p>
  <div class="who">Birth record: Puerto Rico, Civil Registrations, 1885-2001. Social Security application: U.S., Social Security Applications and Claims Index, 1936-2007 (SSN 582808084). Burial place: U.S., Find a Grave Index. The competing "Juan B. Colón Pérez" father claim comes from an unrelated public Ancestry tree with no attached document &mdash; noted, not accepted. Background on Puerto Rican migration to New York and Hart Island is public history, not a specific record of Iraida's own life.</div>`},

{doc:"A Marriage Record Opens Two More Generations", html:`
  <span class="eyebrow">Arecibo, 30 September 1913</span>
  <h1>The wedding record that named Eleuterio's parents &mdash; and his mother's parents, too.</h1>
  <p class="lead">Eleuterio Cruz y Olivo &mdash; father of Iraida, great-great-grandfather of Omar &mdash; had two "Potential" parent tags sitting on his profile for most of this project: names an algorithm guessed, that this book's rule said not to trust without a document. His 1913 marriage record turned out to be that document.</p>
  <img class="doc-photo" src="img/eleuterio_cruz_marriage_1913.jpg" alt="1913 Acta de Matrimonio for Eleuterio Cruz Olivo and Nicolasa Santiago, Arecibo, Puerto Rico">
  <p>On 30 September 1913 in Arecibo, twenty-five-year-old Eleuterio Cruz Olivo married Nicolasa Santiago &mdash; a first marriage, years before the Dolores Santiago the family already knew about, and a real, separate fact rather than a duplicate. The record names his parents plainly: father <strong>Bartolo Cruz</strong>, mother <strong>Juana Olivo</strong>. That was enough to convert two guesses into two confirmed great-great-great-grandparents: <strong>Bartolome Cruz Munoz</strong> (1850&ndash;1914) and <strong>Juana Olivo Y Cabrera</strong> (abt. 1852&ndash;1925).</p>
  <p class="lead">Arecibo in September 1913 was a working port town on Puerto Rico's north coast, its harbor built for shipping the region's sugar and its river, the Río Grande de Arecibo, cutting the town in two. A wedding like Eleuterio and Nicolasa's would have happened at the parish or the town's civil registry office, likely followed by nothing grander than a family meal &mdash; formal wedding photography and receptions were still a luxury reserved for the town's wealthier families.</p>
  <div class="who">Marriage record: Puerto Rico, Civil Registrations, 1885-2001, Arecibo Matrimonios 1909-1922. Arecibo background is public history, not a specific record of this wedding.</div>`},

{doc:"Juana's Own Death Record Goes a Generation Further", html:`
  <span class="eyebrow">Hatillo, 27 September 1925</span>
  <h1>A document, not matching software, settles two more names.</h1>
  <p class="lead">Juana Olivo Y Cabrera's own death record went a generation further than the marriage record alone could. She died in Hatillo on 27 September 1925, and her <em>Certificado de Defunción</em> names her parents too: <strong>Miguel Olivo</strong> and <strong>Polonia Cabrera Y Rosario</strong>. Two more Potential tags, sitting untouched on Ancestry from a stranger's tree, confirmed by Juana's own paperwork the same way Miguel Cardona Reyes's parents were confirmed a few pages back &mdash; not by matching software, but by a document that says so.</p>
  <img class="doc-photo" src="img/juana_olivo_death_cert_1925.jpg" alt="1925 Certificado de Defunción for Juana Olivo Cabrera, Hatillo, Puerto Rico">
  <p>One marriage record and one death certificate took a line that had been frozen at "Potential" for the whole project and pushed it back two full generations: <strong>Miguel Olivo</strong> and <strong>Polonia Cabrera Y Rosario</strong>, parents of <strong>Juana Olivo Y Cabrera</strong>, who with <strong>Bartolome Cruz Munoz</strong> raised <strong>Eleuterio Cruz y Olivo</strong> (1887&ndash;1936) &mdash; father of Iraida.</p>
  <div class="who">Puerto Rico, Civil Registrations, 1885-2001 (Juana Olivo Cabrera, Hatillo Defunciones 1925).</div>`},

{doc:"Bartolome's Hidden Siblings", html:`
  <span class="eyebrow">Aguadilla, 1944</span>
  <h1>A death certificate that turned out to belong to someone else entirely.</h1>
  <p class="lead">Bartolome Cruz Munoz's own paperwork added something no one had asked for: siblings for Eleuterio's line. A 1910 census listed a child, Vierze, not yet in the tree. A Social Security record named another, Secundino.</p>
  <p>And what looked like Bartolome's own death record turned out, on closer reading, to actually be his daughter <strong>Mercedes Cruz Olivo's</strong> 1944 death certificate from Aguadilla &mdash; naming Bartolomé Cruz and Juana Olivo as her parents, a second document confirming the same couple from a completely different angle, thirty years after Bartolome himself had died.</p>
  <img class="doc-photo" src="img/mercedes_cruz_olivo_death_cert_1944.jpg" alt="1944 death certificate for Mercedes Cruz Olivo, Aguadilla, Puerto Rico">
  <div class="who">Death records: Puerto Rico, Civil Registrations, 1885-2001 (Mercedes Cruz Olivo, Aguadilla Defunciones 1942-1946). Census and Social Security records corroborate residence and additional children.</div>`},

{doc:"Domingo's Eight", html:`
  <span class="eyebrow">Sabana Hoyos, Arecibo</span>
  <h1>Eight children, two grandchildren the family never met.</h1>
  <p class="lead">Domingo Aquilino Montalvo Dominguez (1878&ndash;1970) and Dionicia Ramos Santiago (1876&ndash;1972), married 22 March 1901 in Arecibo, raised eight children in Sabana Hoyos. One of them, María Montalvo Ramos, is Amado Marrero Montalvo's mother &mdash; Omar's great-great-grandmother. The other seven are her siblings, Amado's aunts and uncles, mostly forgotten until this project went looking.</p>
  <p>Four of the eight are dead ends online &mdash; Andrea, Hilario, Manola, and Cándida either had no children or none recorded. But two branches opened wide: Granelio's five children and Gertrudis's five, covered on their own pages next.</p>
  <p class="lead">Sabana Hoyos in the early 1900s was one of Arecibo's rural barrios &mdash; scattered farmhouses along dirt roads climbing into the limestone hills north of the karst country, no real town center, just a school, a chapel, and small landholdings growing tobacco and provision crops alongside a little coffee. Eight children was not unusual for a family like Domingo and Dionicia's; large families were both an economic necessity, more hands for the harvest, and a hedge against the era's infant and childhood mortality, which the four dead-end lines in this chapter quietly illustrate.</p>
  <div class="who">FamilySearch Family tab, Domingo Aquilino Montalvo Dominguez (PID L6RL-N7P) and Dionicia Ramos Santiago De Montalvo (PID GPY9-MKX), checked sibling-by-sibling, 2026-07-22. Background on Sabana Hoyos is public history, not a specific family record.</div>`},

{doc:"Granelio Montalvo's Five", html:`
  <span class="eyebrow">Sabana Hoyos, into the 2000s</span>
  <h1>The branch that lived long enough to almost reach today.</h1>
  <p class="lead"><strong>Granelio Montalvo</strong> &mdash; one of Domingo and Dionicia's eight, María Montalvo Ramos's brother &mdash; and his wife Carmen González Serrano had five children: Domingo, <strong>Pedro</strong> (1929&ndash;2010), <strong>Carmen María</strong> (1932&ndash;2007), Matilde, and <strong>Damián</strong> (1935&ndash;2008).</p>
  <p>Three of the five lived recently enough &mdash; into 2007, 2008, 2010 &mdash; that they plausibly have living children and grandchildren walking around today, distant cousins of Omar's who have never heard this name. Checking each individually turned up nothing further online: no spouses, no children recorded, even for the ones who lived into their eighties. Damián had a documented partner, Elena Cruz Díaz, but no children listed. It's not that the line ended &mdash; it's that the paper trail runs out exactly where digitized records stop being free, usually somewhere in the 1960s onward.</p>
  <p>By the time Granelio's own children were growing up mid-century, Puerto Rico's Operation Bootstrap was pulling the island's economy from agriculture toward manufacturing &mdash; the reason so many of this generation's records simply stop, scattered to factory jobs on the mainland instead of staying put to be found by a search decades later.</p>
  <div class="who">FamilySearch Family tab, Granelio Montalvo and Carmen González Serrano's children, 2026-07-22. Operation Bootstrap context is public history.</div>`},

{doc:"Gertrudis Montalvo's Five", html:`
  <span class="eyebrow">Sabana Hoyos</span>
  <h1>Five more names, waiting on the same unfinished search.</h1>
  <p class="lead"><strong>Gertrudis Montalvo y Ramos</strong> &mdash; María Montalvo Ramos's sister &mdash; and her husband Concepción Montalvo Vázquez had five children: <strong>Josefa, Inocencio, Lydia, Blanca,</strong> and <strong>Santos</strong> Montalvo.</p>
  <p>Like Granelio's branch, none of the five has been checked yet for a spouse or children of their own. They are confirmed, sourced people &mdash; Amado's first cousins, Omar's first cousins twice removed &mdash; simply not yet followed forward past their own births.</p>
  <div class="who">FamilySearch Family tab, Gertrudis Montalvo y Ramos and Concepción Montalvo Vázquez's children, 2026-07-22.</div>`},

{doc:"Robert Marrero Montalvo, Korean War", html:`
  <span class="eyebrow">Farmingdale, New York</span>
  <h1>A brother who went to Korea and never came home to Puerto Rico.</h1>
  <p class="lead">Robert Marrero Montalvo (1925&ndash;3 August 1963) was Amado's brother &mdash; one of Juan Ramón Marrero and María Montalvo Ramos's children, Thelma's uncle, Omar's great-granduncle. His birth record names his mother correctly as María Montalvo Ramos and puts his birth in Arecibo, matching the rest of the family exactly.</p>
  <p>What he did with his life is what makes his record stand out from his siblings': a U.S. Veterans' Gravesites record shows Robert served as a Private First Class during the Korean War, 1951&ndash;1953. He died young, at thirty-eight, on 3 August 1963, and is buried at Long Island National Cemetery in Farmingdale, New York &mdash; a long way from Sabana Hoyos and Arecibo, the world his parents and siblings never left.</p>
  <p>No spouse or children turned up in any record checked. He is, as far as this project can prove, a dead end &mdash; but a documented one, a real person whose service is now part of the family's record instead of a name with no story attached.</p>
  <div class="who">Puerto Rico, Civil Registrations, 1885-2001 (birth record, Arecibo); U.S., Veterans' Gravesites, ca.1775-2019 (Long Island National Cemetery, Farmingdale, NY), both attached to Robert Marrero Montalvo's Ancestry profile, 2026-07-25.</div>`},

{doc:"Julia's Family — the González Lago In-Laws", html:`
  <span class="eyebrow">San Felipe, Arecibo, 1950</span>
  <h1>A sister who married out, and a household caught whole in one census.</h1>
  <p class="lead">Julia Marrero Montalvo (1927&ndash;2012) &mdash; Amado's sister, Thelma's aunt, Omar's great-grandaunt &mdash; married Héctor Manuel González Lago (1922&ndash;2003), whose own parents, Juan González Morales and Martina Lago de González, ran a household in Arecibo's San Felipe neighborhood. The 1950 federal census caught all of them together at 159 Atlos Street: Héctor's parents as head and wife, his sister Hilda and brother Roberto still living at home, and Julia listed as "Yerna" &mdash; daughter-in-law &mdash; with two small children of her own, covered on their own pages next.</p>
  <div class="who">1950 United States Federal Census, Arecibo, Puerto Rico, San Felipe, Dwelling 15, Enumeration District 12-22, household of Juan González Morales, 2026-07-25.</div>`},

{doc:"Norma, Fifteen Years", html:`
  <span class="eyebrow">Arecibo, 1947&ndash;1962</span>
  <h1>Julia's daughter, gone too young.</h1>
  <p class="lead"><strong>Norma González Marrero</strong> was two years old in the 1950 census, living with her parents in her grandparents' household. Her later record is a hard one: she died in Arecibo on 2 November 1962, at only fifteen. Her death record names her parents as Héctor M. González Lago and Julia Marrero, matching the family exactly.</p>
  <div class="who">Puerto Rico, Civil Registrations, 1885-2001 (death record, Arecibo, 1962); 1950 United States Federal Census; both attached to Norma González Marrero's Ancestry profile, 2026-07-25.</div>`},

{doc:"Angel Luis, Found and Followed", html:`
  <span class="eyebrow">Arecibo, 1948&ndash;1997</span>
  <h1>The son who never had a first name in this book, until now.</h1>
