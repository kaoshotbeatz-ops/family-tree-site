  <p class="lead">Until this pass, the book called him only "a son, surname González Marrero, first name not recorded." The 1950 household list settled it: <strong>Angel Luis González Manero</strong> (recorded with the same "Manero" transcription variant as his sister Norma), age one, born about 1949, "Nieto" &mdash; grandchild &mdash; in his grandparents' Arecibo household.</p>
  <img class="doc-photo" src="img/angel_luis_norma_1950_census.jpg" alt="1950 United States Federal Census page, San Felipe, Arecibo, Puerto Rico, household of Juan González Morales, with Angel Luis and Norma González highlighted">
  <div class="doc-photo-cap">1950 U.S. Census, San Felipe, Arecibo, PR &middot; Angel Luis and Norma's line highlighted</div>
  <p>A Social Security record found in a follow-up search confirms the rest of what can currently be proven: born 1 October 1948 in Arecibo, died 15 February 1997, at forty-eight. The record names his parents exactly &mdash; Hector Gonzalez and Julia Marrero &mdash; the strongest possible confirmation short of his own birth certificate.</p>
  <p>What isn't yet confirmed: family memory holds that Angel Luis served in the U.S. Army, but no military record found so far names his parents directly &mdash; "Angel Luis González" is common enough in Puerto Rico that Navy muster rolls, Army casualty files, and the VA's death index all return multiple same-named men, none distinguishable from him without a parent match. If a service record surfaces that actually names Héctor and Julia, it belongs here; until then, this stays an honest open thread rather than a guess forced into place.</p>
  <div class="who">1950 United States Federal Census, household of Juan González Morales, Arecibo; U.S., Social Security Applications and Claims Index, 1936-2007 (Angel Luis Gonzalez Mor, parents Hector Gonzalez and Julia Marrero); both attached to Angel Luis González Marrero's Ancestry profile, 2026-07-25. Military service is family recollection, not yet backed by a matched primary record.</div>`},

{doc:"Three Who Didn't Survive Childhood", html:`
  <span class="eyebrow">La Cruz, Arecibo</span>
  <h1>Milagros's brothers, gone before they could grow up.</h1>
  <p class="lead">Milagros wasn't an only child. Guillermo Arocho Medina and María Hernández y Núñez had at least six children, and half of them didn't live to grow up &mdash; ordinary, and quietly brutal, for the place and time.</p>
  <p><strong>Juan Salvador</strong> died in 1919, the same year he was born. <strong>Roberto</strong> died in 1925, also an infant. <strong>José María</strong> (b. 1921) has no death date on record at all &mdash; he'd be 104 today, so the silence almost certainly means he died at some point with no one updating the record, not that he's still alive.</p>
  <div class="who">FamilySearch Family tab for Guillermo Arocho Medina and María Hernández y Núñez's children (PIDs 2W7N-XJS, KP7P-3DQ, 2W7N-X2P), 2026-07-22.</div>`},

{doc:"Rosa María, Buried Beside Her Parents", html:`
  <span class="eyebrow">Cementerio La Santa Cruz, Arecibo</span>
  <h1>The sister who made it to fifty-nine.</h1>
  <p class="lead"><strong>Rosa María Arocho Hernández</strong> (abt. 1920 &ndash; 30 March 1979) is Milagros's sister &mdash; one of the two who lived to adulthood. She is buried next to Milagros and Guillermo themselves at Cementerio La Santa Cruz in Arecibo; the headstones match photos already in this project's records, three graves in a row telling the same family's story in stone.</p>
  <p>She married Víctor Cruz Feliciano on 25 August 1943 and had four children: two who died in infancy, and two &mdash; Orlando and Miryam &mdash; who lived full adult lives.</p>
  <div class="who">FamilySearch Family tab (PID L7FP-L53); headstone photographs, Cementerio La Santa Cruz, Arecibo, 2026-07-22.</div>`},

{doc:"Orlando and Miryam Cruz Arocho", html:`
  <span class="eyebrow">The strongest open lead in this branch</span>
  <h1>Rosa María's surviving children, and the cousins they might have.</h1>
  <p class="lead">Rosa María Arocho Hernández and Víctor Cruz Feliciano's two children who survived to adulthood: <strong>Orlando Cruz Arocho</strong> (1947&ndash;2000) and <strong>Miryam Cruz Arocho</strong> (1954&ndash;1998). Both are real, documented people &mdash; Omar's first cousins twice removed &mdash; but no marriage or children have been found for either yet.</p>
  <p>Of everyone documented so far on the Arocho side, this is the strongest open lead: Orlando lived to fifty-three, Miryam to forty-four, both well past the age most people marry and have families. If either left descendants, they are living relatives nobody in this family has ever met. Worth a dedicated search when this project comes back around to unfinished threads.</p>
  <div class="who">FamilySearch Family tab, children of Rosa María Arocho Hernández and Víctor Cruz Feliciano (PIDs 2W7N-XJS, KP7P-3DQ), 2026-07-22.</div>`},

{doc:"Guillermo's Twelve", html:`
  <span class="eyebrow">La Torre, Lares</span>
  <h1>Martín Arocho's second marriage, and the dozen children it produced.</h1>
  <p class="lead">Martín Arocho y Román married twice. His first wife, María Josefa Pérez, gave him six children whose names the informant on his own death certificate simply didn't know &mdash; "cuyos nombres ignora el declarante," the clerk wrote, a small, honest admission that some names are gone for good. His second wife, Felipa Delores Medina y Caos, is the one this family descends from.</p>
  <p>Martín and Felipa raised twelve children in La Torre, Lares. Guillermo &mdash; Milagros's father, Omar's great-great-grandfather &mdash; was one of them. His siblings, confirmed on FamilySearch with real sourcing: <strong>Gregoria, Eusebio, José</strong> (1888&ndash;1940), <strong>Salome</strong> (1888&ndash;1964), <strong>Juan Rosendo</strong> (1893&ndash;1966), <strong>Anselma</strong> (1894&ndash;1939), <strong>Alejandra</strong> (1896&ndash;), and several more whose names blur at the edge of the handwriting on the original document.</p>
  <p>Most of the twelve are still just names and dates &mdash; siblings confirmed, but not yet followed forward into their own marriages and children. One of them, though, turned out to have a branch of his own worth an entire page: Eusebio.</p>
  <div class="who">Martín Arocho y Román's death certificate, 1910, Lares, Puerto Rico (records/familysearch-documents/martin_arocho_y_roman_death_cert_1910.pdf); FamilySearch Family tab for Martín Arocho y Román + Felipa Delores Medina y Caos.</div>`},

{doc:"Five More Siblings, Not Yet Followed Forward", html:`
  <span class="eyebrow">La Torre, Lares</span>
  <h1>Names and dates, waiting for someone to trace them further.</h1>
  <p class="lead">Beyond Guillermo and Eusebio, five more of Martín Arocho y Román and Felipa Delores Medina y Caos's twelve children are confirmed on FamilySearch with real sourcing, though none has been followed into a marriage or children of their own yet.</p>
  <p><strong>Gregoria Arocho Medina</strong> has no dates recorded. <strong>José Arocho Medina</strong> lived 1888&ndash;1940. <strong>Salome Arocho Medina</strong> lived 1888&ndash;1964, sharing a birth year with José &mdash; plausibly twins, though nothing on record confirms it. <strong>Juan Rosendo Arocho Medina</strong> lived 1893&ndash;1966. <strong>Anselma Arocho Medina</strong> lived 1894&ndash;1939. <strong>Alejandra Arocho Medina</strong> was born in 1896, with no death date captured.</p>
  <p>Every one of these is a real, sourced person &mdash; Omar's great-great-granduncles and -aunts &mdash; simply not yet built out into the living tree. The work left to do here is exactly what turned Eusebio into ten more names: pulling each sibling's own FamilySearch Family tab and following their children forward.</p>
  <div class="who">FamilySearch Family tab for Martín Arocho y Román + Felipa Delores Medina y Caos, 2026-07-22.</div>`},

{doc:"Eusebio's Ten", html:`
  <span class="eyebrow">1906, Lares</span>
  <h1>The uncle who quietly had the biggest family of all.</h1>
  <p class="lead">Eusebio Arocho Medina (1888&ndash;1974) &mdash; Guillermo's brother, Omar's great-great-granduncle &mdash; married Juana Vélez Lugo on 3 December 1906. FamilySearch backs him with 17 sources, more documentation than most of this side of the family has for any single person. Between them, Eusebio and Juana had ten children.</p>
  <p>Manuel (1907&ndash;1950), Eusebio Jr. (b. 1910), Carla (1911&ndash;1937), Carlos (b. 1911), Eusebia (b. 1915), José (b. 1916), Rosario (b. 1919), Sara (1920&ndash;1947), Leocadia (b. 1921), and a tenth whose record is still uncaptured &mdash; ten Arocho y Vélez cousins, Omar's first cousins three times removed, spread across two decades of births in Lares.</p>
  <p>This branch is fully documented but entirely unbuilt &mdash; real FamilySearch entries, real IDs, ready to pull from directly, just never entered into the living Ancestry tree. Given the volume across all twelve of Guillermo's siblings, doing this properly for everyone could easily add fifty more names to the family. It's pure data entry at this point, not research: the hard part, finding them, is already done.</p>
  <p>Eusebio registered for the draft twice, the same as his brother, and his two cards disagree the same way theirs did. His WWI card gives a birth year of 1883; his WWII card, filled out in 1942, gives an exact date &mdash; 13 September 1888 &mdash; and a birthplace of Lares. Same five-year drift, same two brothers, both born before Puerto Rico's civil registration system existed to settle the question definitively. By 1942 he was registering in Santurce, in the San Juan metro area, a long way from the Lares hills where both brothers were born &mdash; one more small sign of how much the family had scattered off the mountain by the middle of the twentieth century.</p>
  <div class="who">FamilySearch Family tab for Eusebio Arocho Medina (PID GMR6-424) and Juana Vélez Lugo, 2026-07-22. U.S., WWI Draft Registration Cards, 1917-1918 and U.S., WWII "Old Man's Draft" Registration Cards, 1942, both read via Fold3.com, 2026-07-24.</div>`},

{doc:"Three of Eusebio's Children, Gone Young", html:`
  <span class="eyebrow">Lares, 1937&ndash;1950</span>
  <h1>Manuel, Carla, and Sara didn't reach old age either.</h1>
  <p class="lead">Of Eusebio Arocho Medina and Juana Vélez Lugo's ten children, three have death dates on record, and all three died relatively young. <strong>Manuel Arocho Vélez</strong> (1907&ndash;1950) made it to forty-three. <strong>Carla Arocho Vélez</strong> (1911&ndash;1937) died at twenty-six. <strong>Sara Arocho Vélez</strong> (1920&ndash;1947) died at twenty-seven.</p>
  <p>None of the three has a marriage or children on record. Whether that's because they genuinely died without descendants, or simply because those records haven't surfaced yet, is one more open question in a branch this project has confirmed but not yet fully built out.</p>
  <div class="who">FamilySearch Family tab for Eusebio Arocho Medina and Juana Vélez Lugo's children, 2026-07-22.</div>`},

{doc:"The Six Who Lived Longer, Unchecked", html:`
  <span class="eyebrow">Lares, born 1910&ndash;1921</span>
  <h1>Six cousins whose adult lives are still unwritten.</h1>
  <p class="lead">The other six of Eusebio and Juana's ten children have birth years but no death dates captured yet: <strong>Eusebio Jr.</strong> (b. 1910), <strong>Carlos</strong> (b. 1911), <strong>Eusebia</strong> (b. 1915), <strong>José</strong> (b. 1916), <strong>Rosario</strong> (b. 1919), and <strong>Leocadia</strong> (b. 1921). A tenth child's record is still uncaptured entirely.</p>
  <p>None of the six have been checked yet for their own marriages or children &mdash; the same open task noted throughout this branch. If any lived into the digitized-records era, which several plausibly did given their birth years, their own descendants would be Omar's living third cousins.</p>
  <div class="who">FamilySearch Family tab for Eusebio Arocho Medina and Juana Vélez Lugo's children, 2026-07-22.</div>`},

{doc:"The Living Branches", html:`
  <span class="eyebrow">2026</span>
  <h1>Not every page in this book is about the dead.</h1>
  <p class="lead">Most of this project has been about proving who came before. This page is about who's still here &mdash; the aunts, uncles, and cousins Omar carries in memory, not in a document, and a mistake in the tree itself that quietly turned an uncle into a stepfather.</p>
  <p>Omar's father, Juan José Huertas Vargas, had children with several women over his life, covered on the next page. And one correction lives here: Ancestry's own automatic matching had, at some point, linked <strong>Angel A. Marrero</strong> as Yadyra's spouse instead of her uncle &mdash; which made him show up as Omar's stepfather, and made Omar and Elkyn look like his own children. Omar caught it immediately: "he's still my great uncle." Angel is Thelma Marrero's brother, son of Amado Marrero Montalvo and Rosa Ceballo &mdash; Yadyra's uncle, and Omar's great-uncle, exactly as it should have read from the start.</p>
  <div class="who">Names and relationships in this chapter are family-told by Omar Huertas, per this project's standing rule that direct testimony about immediate and near family counts as fact without requiring an outside document.</div>`},

{doc:"Omar's Half-Siblings, Named from Memory", html:`
  <span class="eyebrow">Living family, told directly by Omar</span>
  <h1>Not every fact in this book needed a document. Some just needed to be asked.</h1>
  <p class="lead">Omar's father, Juan José Huertas Vargas, had children with several women over his life. Alongside Yadyra's own two &mdash; Omar and his brother <strong>Elkyn</strong> &mdash; Omar named the rest directly: <strong>Luica</strong> (whose son is Juan Carlos), <strong>William</strong>, <strong>Melba</strong> (mother of David, Marcella, and Lissete, who passed around 1999 or 2000), <strong>Iris</strong> (mother of Juan Jose, Manuel, Bridget, Irus, and Breanna), and <strong>Angelica</strong> (mother of Catila, Sabashian, and Nicholus). None of this lives in any government record &mdash; it lives in Omar's own memory, and that's exactly what this project has always counted as fact when it comes to immediate family.</p>
  <p>Omar's grandmother Beatriz had children too, beyond Juan José: <strong>Pablo, Hector, Guillermo, Manuel,</strong> and <strong>Chella</strong> &mdash; Omar's own uncles and aunt, named the same way, from memory rather than paper. Pablo is the same uncle whose text message, elsewhere in this book, settled Juan José's own parentage.</p>
  <div class="who">Names and relationships in this chapter are family-told by Omar Huertas, per this project's standing rule that direct testimony about immediate and near family counts as fact without requiring an outside document.</div>`},

{doc:"The Day They Got to Me", html:`
  <span class="eyebrow">1978</span>
  <h1>Omar.</h1>
  <p class="lead">Two centuries of farmers, clerks, witnesses, and the people who married them &mdash; and it comes down to one name, one year, one city.</p>
  <p>He was born to Yadyra Cardona and Juan José Huertas Vargas, the great-grandson of a woman born the day before Christmas in Arecibo, and of a man who died and was buried on Long Island, New York, far from where his own story began.</p>
  <p>He has a brother, Elkyn. And somewhere behind him, quietly proven one document at a time, is every name in this book &mdash; farmers from Añasco, a widowed mother in Lares who remarried and kept going, a man whose first marriage was almost lost to history, and a family that crossed an ocean and came back to a single grave in Arecibo.</p>
  <p>This is where the record ends, for now. It is not where the family does.</p>`},

{doc:"Polina's Line — The Vostrovs of Khimki", html:`
  <span class="eyebrow">Moscow governorate, Russia &middot; a second family joins the book</span>
  <h1>Serfs, a railway settlement, and eight generations to Polina.</h1>
  <p class="lead">In 2026, Omar married Polina Alexeevna Vostrova. Her family had already done what this whole book is built on: a professional genealogist, Olga Borisovna Kornilova, had spent years tracing the Vostrov line back to a serf born around 1800. That report is the source for everything in this chapter.</p>
  <p>The earliest name in Polina's family isn't even a full name &mdash; just <strong>Karp</strong>, no dates recorded. His son, <strong>Stepan Karpovich Vostrov</strong>, was born around 1800 and died in 1843. Stepan's son, <strong>Avvakum Stepanovich Vostrov</strong> (born around 1824), was a serf of the Satin landowners &mdash; bound to their estate the way Puerto Rico's Arocho and Montalvo ancestors were bound to nothing at all, which is its own kind of contrast worth sitting with. Serfdom in Russia didn't end until 1861. Avvakum was sent into military conscription in 1845, a fate that often meant permanent separation from home and family, but he made it back to his village by 1870. By 1883 the family had left peasant status behind for good, registering as <strong>Moscow meshane</strong> &mdash; townspeople, a legal step up in Imperial Russia's social order. Avvakum died in Moscow on 1 August 1897.</p>
  <p>Avvakum's son <strong>Ivan Avvakumovich Vostrov</strong> (born 15 August 1867) is the first of the family recorded living at <strong>Khimki</strong>, a settlement that had grown up around a railway station northwest of Moscow, on the line to Saint Petersburg. His wife was <strong>Evdokia Yakovleva</strong>. Their son <strong>Vasily Ivanovich Vostrov</strong>, born 18 March 1908 at the Khimki station settlement, kept the family rooted there &mdash; and so did his son, <strong>Gennady Aleksandrovich Vostrov</strong> (born 12 October 1937 in the city of Khimki, by then no longer just a rail stop), who married <strong>Albina Ivanovna Gromova</strong>.</p>
  <p>Gennady and Albina's daughter, <strong>Viktoria Gennadyevna Vostrova</strong>, was born 19 June 1977, also in Khimki &mdash; four generations after Ivan first settled there. Her daughter is <strong>Polina Alexeevna Vostrova</strong>, born 7 October 1996 in the city of Korolyov. Polina is Omar's wife.</p>
  <p>One detail in the report is flagged but not resolved: Polina's patronymic is "Alexeevna" (daughter of Alexey), while her listed siblings carry different patronymics &mdash; "Maksimovna" and "Andreevna" &mdash; suggesting Viktoria had children with more than one partner over the years. The report doesn't name each father directly. That's a question for Polina to answer directly, not something this book guesses at.</p>
  <div class="who">Source: "Generational Record of the Vostrov Family" (Поколенная роспись рода Востровых), commissioned by the family and researched by historian-genealogist Olga Borisovna Kornilova, report dated 1 January 2022 &mdash; photographed and archived in full, along with an English translation, in <code>records/vostrov-kudryavtseva-polina/</code>. This is pre-revolutionary and Soviet-era Russian genealogy; Ancestry and FamilySearch have essentially no independent records to cross-check it against, so this chapter rests on the strength of the commissioned research itself, the same as any other document in this book.</div>`},

{doc:"The Family Omar Built", html:`
  <span class="eyebrow">Ongoing</span>
  <h1>Not every family in this book was inherited. Some of it was chosen.</h1>
  <p class="lead">Genealogy usually runs backward &mdash; who came before, who's descended from whom, who's blood and who isn't. This page runs the other direction: the people Omar became family to on purpose, over years, not by birth.</p>
  <p>Before Polina, Omar spent twelve years with a woman named <strong>Erika</strong>. Her son, <strong>Mario Molina</strong>, became Omar's stepson for all twelve of those years &mdash; raised, not born, into the family, the same shape as Angel and Omar himself a generation earlier. Mario has a half-sister, <strong>Natalia</strong>, who shares his mother Erika but not his father.</p>
  <p>Polina brought a daughter of her own into the family: <strong>Alice</strong>, whose biological father is <strong>Justin</strong>. Omar is Alice's stepfather now, the same role Angel once filled for him &mdash; family-told, not paper-proven, and not needing to be. This book has spent most of its pages insisting that a relationship isn't real until a document says so. This page is the exception on purpose: some relationships are real because the people living them say they are, and twelve years, or a childhood, is its own kind of proof.</p>
  <div class="who">Family-told by Omar Huertas, 2026. Per this project's standing rule, direct testimony about immediate and near family counts as fact without requiring an outside document — the same standard genealogists have always applied to living memory, as distinct from claims about the distant dead.</div>`},

{doc:"Angel's Family — The Ceballos Line", html:`
  <span class="eyebrow">East Rockaway &amp; Freeport, New York &middot; 1942&ndash;2022</span>
  <h1>The man who raised Omar had a family of his own &mdash; and it turns out it was Omar's family too.</h1>
  <p class="lead">Amado Marrero Montalvo married twice. His first wife, Milagros Arocho Hernández, is Omar's direct blood line &mdash; Thelma's mother. His second wife, married in Manhattan in 1950, was <strong>Rosa Alicia Ceballo Marrero</strong>. Their son is <strong>Angel A. Marrero</strong> &mdash; Thelma's half-brother, Omar's great-uncle, and the man who actually raised Omar.</p>
  <p>Amado and Rosa lived at <strong>33 Prospect Ave, East Rockaway, New York</strong>, before Rosa later moved to Freeport &mdash; both towns in the same stretch of Nassau County where Omar's own family lived, in Baldwin, not far away at all. Omar confirmed all of this directly: he personally knew Rosa Ceballo, remembers the move from East Rockaway to Freeport, and remembers that Amado's father lived past 100 years old &mdash; which the record backs up exactly: Ramón "Moncho" Ceballo Vargas, Rosa's father, lived from 1905 to 2009, dying at 103.</p>
  <p>Rosa had a daughter besides Angel: <strong>Yvonne Harris</strong>, found through Rosa's own death record in 2026 &mdash; a name nobody currently living had mentioned, sitting quietly in a cemetery record until this year. She is Angel's half-sister the same way Angel is Thelma's.</p>
  <p>And there's a second lead still open: a family tree hint, corroborated independently by three different Ancestry researchers, names a son of Amado and Milagros who isn't in any family conversation &mdash; <strong>Juan Ramón Marrero Arocho</strong>, who Omar confirmed died in Puerto Rico at fifteen. He's now entered in the tree, though the actual 1959 death record hasn't surfaced yet.</p>
  <img class="doc-photo" src="img/amado_marrero_portrait_1940s.jpg" alt="Portrait of Amado Marrero Montalvo, approx. 1940s, Arecibo, Puerto Rico">
  <div class="doc-photo-cap">Amado Marrero Montalvo, approx. 1940s, Arecibo &mdash; the "AM" monogram on his shirt is his own initials. Shared to Ancestry by researcher mrsymm2010, 2015.</div>
  <p>Long before any of that, Amado registered for the WWII draft in Arecibo on 27 June 1942, eighteen years old, unemployed, five foot eight, 122 pounds, light complexion, black hair, brown eyes. The card lists his contact person as his own father, <strong>Juan Ramón Marrero</strong> &mdash; a small detail, but the kind that confirms a relationship in a stranger's official handwriting rather than family memory alone. It's a portrait of a teenager with no job yet and no way of knowing he'd go on to marry twice, raise a family across two households, and end up, decades later, the man who raised his own great-nephew.</p>
  <div class="who">Family-told by Omar Huertas, 2026-07-23, cross-checked against Rosa Ceballo's and Ramón Ceballo Vargas's Ancestry hint records (U.S. Public Records Index, Social Security Death Index, and residence directories, 1950&ndash;2021) and the 1950 New York marriage-license index. Amado Marrero Montalvo's WWII draft card, U.S., WWII Draft Registration Cards, 1940, read via Fold3.com, 2026-07-24.</div>`},

{doc:"Seven Generations of Ceballo, Back to Loíza", html:`
  <span class="eyebrow">Loíza &amp; Río Grande, Puerto Rico &middot; abt. 1797&ndash;2021</span>
  <h1>Following Angel's mother's family back further than almost anyone else in this book.</h1>
  <p class="lead">Rosa Ceballo's line turned out to go back further than expected, one Ancestry hint at a time, each one matched against a household that already checked out. This is the deepest confirmed generation reached anywhere in this project so far.</p>
  <p>Rosa's father was <strong>Ramón "Moncho" Ceballo Vargas</strong> (1905&ndash;2009), who married <strong>Alicia Marrero Alvelo</strong> in Bayamón in 1932. His parents were <strong>Ramón Ceballos Y Calderón</strong> (b. 1859, Río Grande County) and <strong>Nicasia Mojica Quiñones</strong> (b. abt. 1875) &mdash; a household tracked across five straight censuses, 1910 through 1940, always in the same corner of Río Grande. His own WWII draft card, registered 20 November 1940 in Bayamón, independently confirms his exact birthdate &mdash; 31 August 1905, to the day &mdash; and lists his wife, "Marrero, Alicia," as his contact, living together in Bayamón's Pueblo Nuevo neighborhood. The card's physical description fills in a picture no photograph in this book can offer: 165¼ pounds, five foot six and a quarter inches, light brown complexion, black hair, brown eyes &mdash; a thirty-five-year-old man, more than six decades from the age Omar would come to know his residence history through, standing in a registration line in 1940 with no way of knowing he had sixty-nine more years ahead of him.</p>
  <p>The records give you 103 years and a physical description. Omar gives you the man. He remembers Moncho as one of the cool ones &mdash; a grandfather-figure who was always around growing up &mdash; and remembers a particular trick of his: <strong>he used to pretend he was deaf.</strong> He'd let the talk roll on around him, about baseball or about food, and everyone would speak freely as if he couldn't hear a word. He heard every single one of them. A century of a man quietly catching everything while the room assumed he wasn't. No census column has a field for that.</p>
  <p>The 1910 census also answers a question this book hadn't asked yet directly: on that record, taken in Cienega Baja, Río Grande, the enumerator recorded Ramón Ceballos Y Calderón's race as <strong>"Mulatto"</strong> &mdash; the same designation given to his son Ramón Ceballos Y Mojica, listed in the same household at age six. It's the clearest documentary evidence in this entire project of African ancestry on Omar's confirmed direct blood line, not a guess from a surname or a hometown, but a government clerk's own word, written down in the moment, about a real ancestor this book has independently traced through five straight censuses. Loíza itself, where this family goes back another two generations before the records run out, has been one of Puerto Rico's most historically Afro-Puerto Rican regions since the colonial era &mdash; settled in part by free and escaped enslaved people, and still the island's best-known center of Afro-Puerto Rican culture today. That context doesn't prove anything about Mauricio or Eduviges specifically, but Ramón's own census record doesn't need it to: it says what it says.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001; U.S. Federal Census 1910 (race field for Ramón Ceballos Y Calderón and household); Ramón "Moncho" Ceballo Vargas's own WWII draft card, U.S., WWII Draft Registration Cards, 1940, read via Fold3.com, 2026-07-24. Confirmed generation by generation via Ancestry's Potential-parent matching, 2026-07-23.</div>`},

{doc:"Mauricio and Eduviges, and the Edge of the Record", html:`
  <span class="eyebrow">Canóvanas &amp; Río Grande &middot; 1825&ndash;1895</span>
  <h1>Six generations back, and one more name pulled from the margins.</h1>
  <p class="lead">Ramón Ceballos Y Calderón's own parents were <strong>Mauricio Ceballos</strong> (22 Sep 1825 &ndash; 4 Oct 1888, Canóvanas/Loíza) and <strong>Eduviges Calderón y Ortiz</strong> (abt. 1835 &ndash; 27 Ago 1895, Río Grande) &mdash; confirmed by Mauricio's own baptism-record photo, matching his exact birth date, and Eduviges's own death record naming her husband and children by name.</p>
  <p>Along the way, two more names surfaced that hadn't been recorded anywhere: Mauricio and Eduviges had a daughter, <strong>Catalina Ceballos Y Calderón</strong>, and a son, <strong>Jesús Ceballos Calderón</strong> &mdash; both found only because their names appeared as informants or claimants on documents that were actually about someone else.</p>
  <p>One lead that firmed up into fact: a hint had named Mauricio Ceballos's own mother as <strong>Concepción Ceballos</strong>, and at first it was left out for lack of proof &mdash; but Mauricio's own 1888 civil death record, found in a later pass, names his mother in the clerk's own hand: Concepción Ceballos. She's now a confirmed ancestor, one more generation back on the Loíza line, documented rather than guessed.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001 (death records for Eduviges Calderón and Mauricio Ceballos); baptism-record photograph for Mauricio Ceballos shared by descendant researcher Dennis Ortiz.</div>`},

{doc:"Lucas and Andrea, Seventh Great-Grandparents", html:`
  <span class="eyebrow">Loíza &middot; the edge of what any record can show</span>
  <h1>Two independent death records, filed years apart, agreeing on every name.</h1>
  <p class="lead">Eduviges's parents were <strong>Lucas Calderón</strong> (b. abt. 1800) and <strong>Andrea Ortiz</strong> (b. abt. 1797), both of Loíza &mdash; Omar's 7th great-grandparents, and, for now, the edge of what any record can show. No hints, no further ancestors, nothing more to follow above them.</p>
  <p>Lucas Calderón and Andrea Ortiz's own death records turned up in a later pass, and each one stands on its own: Lucas's names his wife Andrea and their daughter Eduviges; Andrea's does the same in reverse, naming Lucas and Eduviges. Two independent civil registrations, filed years apart in the same small mountain town, agreeing with each other on every name &mdash; about as solid as this era of Puerto Rican record-keeping gets.</p>
  <p>A separate, non-primary family tree (not this book's own, someone else's public research) goes one step further and names Andrea's own mother as <strong>Maria de los Angeles Ortiz</strong>, which would be Omar's <strong>8th great-grandmother</strong> if it holds up, plus two more Calderón siblings, Nemecio and Juana Francisca. None of that is backed by a document this project has actually seen, so none of it is in the family tree yet &mdash; a promising lead, not a fact, for whoever picks this thread up next.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001 (death records for Lucas Calderón and Andrea Ortiz). The "Maria de los Angeles Ortiz" lead comes from another researcher's public tree, not a primary document, and is not part of this book's confirmed line.</div>`},

{doc:"Alicia's Side: Marrero and Alvelo", html:`
  <span class="eyebrow">Río Grande &middot; abt. 1888</span>
  <h1>Rosa's mother's side goes back just as far.</h1>
  <p class="lead"><strong>Alicia Marrero Alvelo</strong> (12 Jan 1914 &ndash; 20 Apr 2002) was Ramón "Moncho" Ceballo Vargas's wife and Rosa's mother. Her own parents were <strong>Pedro Marrero y Medina</strong> and <strong>María Alvelo Hernández</strong>, both born around 1888 in Puerto Rico &mdash; Omar's 6th great-grandparents on this side, confirmed the same way as everything else in this branch: census after census, in the same town, naming the same people.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001 (death record for Alicia Marrero Alvelo); confirmed via Ancestry's Potential-parent matching, 2026-07-23.</div>`},

{doc:"Nicasia Mojica's Household", html:`
  <span class="eyebrow">Río Grande &middot; 1898&ndash;1940</span>
  <h1>A marriage record names a father, and two more children surface.</h1>
  <p class="lead">Nicasia Mojica Quiñones's own trail turned up something real. Her marriage record, dated 20 December 1898 in Río Grande, names her father as <strong>Victoriano Mojica</strong> &mdash; now confirmed and added to the tree. If Ramón Ceballos Y Calderón's parents are Omar's 7th great-grandparents, Victoriano Mojica sits at the same generation on Nicasia's side.</p>
  <p>Two census years, 1930 and 1940, plus a Social Security application, confirm a household that also included children never written down anywhere before this project found them: <strong>Jacinto</strong> and <strong>María (Teresa) Ceballo Y Mojica</strong>, the latter independently confirmed a second time by that Social Security record. A non-primary public family tree separately names Nicasia's own mother as <strong>Jacinta Quiñones</strong> &mdash; a promising next lead, not yet confirmed by a primary document.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001 (Nicasia Mojica Quiñones marriage record naming father Victoriano Mojica); U.S. Federal Census 1930 and 1940; U.S. Social Security Applications and Claims Index entry for María Teresa Ceballos Mojica. The "Jacinta Quiñones" lead comes from another researcher's public tree, not a primary document.</div>`},

{doc:"Following the Family Down: Rosa María's Children", html:`
  <span class="eyebrow">Arecibo &mdash; and later, Greensboro and beyond</span>
  <h1>This book doesn't just climb backward. Sometimes it has to correct the present.</h1>
  <p class="lead">Most of this project runs one direction: up, generation by generation, toward names further from Omar. But a family tree isn't just ancestors &mdash; it's everyone the line touched, including the branches that go sideways and forward. Rosa María Arocho Hernández and her husband Víctor Cruz Feliciano had at least four children, and following them down turned up both a new discovery and two mistakes worth fixing.</p>
  <p>The 1950 census caught the family whole: Rosa María and Víctor, then five years old, living in the household of Rosa María's own parents, Guillermo Arocho Medina and María Hernández de Arocho, in the La Cruz district of Arecibo. Alongside <strong>Hector F. Cruz Arocho</strong> (age 5) were two more children never recorded anywhere else in this project: <strong>Rosa L. Cruz Arocho</strong>, one year old, and <strong>Víctor L. Cruz Arocho</strong>, an infant. Four children in one household, three of them appearing here for the first time.</p>
  <p>Hector F. Cruz Arocho is the one sibling of the four whose own record trail stayed quiet and ordinary, in the best way &mdash; no corrections needed, nothing contested. Two public-records hints turned up for a "Hector Feliciano" and "Hector L Feliciano," matching only a first name and general era; neither carried his actual surname, Cruz Arocho, so neither was added. The 1950 census remains the clearest single window into his childhood: five years old, living with his parents, grandparents, and two baby siblings under one roof in La Cruz, at a moment when three of the four Cruz Arocho children were all under six years old at once.</p>
  <div class="who">1950 United States Federal Census (household of Guillermo Arocho Medina, Arecibo, La Cruz), confirmed 2026-07-23.</div>`},

{doc:"Correcting the Record: Orlando and Miryam", html:`
  <span class="eyebrow">Arecibo &amp; Vietnam &middot; 1998&ndash;2000</span>
  <h1>A tree marked "Living" isn't always unfinished. Sometimes it's wrong.</h1>
  <p class="lead">The tree had marked two of Rosa María's children &mdash; Orlando and Miryam Cruz Arocho &mdash; as living. They aren't, and the records make it unambiguous rather than uncertain.</p>
  <p>Orlando's death is confirmed by six separate sources that all agree on the same date, 19 April 2000: an obituary, the Social Security Death Index, the Social Security Applications and Claims Index, the VA's BIRLS Death File, and the U.S. Veterans' Gravesites index &mdash; which adds something none of the others could: Orlando served as a <strong>Private 2nd Class in the U.S. Army during Vietnam</strong>, and is buried at Cementerio Municipal in Arecibo. He was born 25 January 1947 and died at 53.</p>
  <p>Miryam's death is confirmed the same way, by two independent Social Security sources that agree exactly: born 23 May 1954 in Arecibo, died 19 May 1998, five days after what would have been her 44th birthday. A third hint, for a "Miriam Cruz Cruz" with a residence in Greensboro, North Carolina running through 2002 &mdash; four years after Miryam's confirmed death &mdash; was left out of the tree. Different surname, and a residence date that outlives her by years; almost certainly a different woman who happens to share a first name.</p>
  <p class="lead">This is what the standing rule about checking for mistakes is actually for. It's easy to assume a tree marked "Living" is simply unfinished, waiting for someone to fill in a date. Sometimes it's wrong, and only checking the record &mdash; not just once, but against every independent source that turns up &mdash; catches it.</p>
  <div class="who">Orlando Cruz Arocho: U.S. Obituary Collection 1930-Current; U.S. Social Security Death Index 1935-2014; U.S. Social Security Applications and Claims Index 1936-2007 (also reconfirms parents Víctor Cruz Feliciano and Rosa María Arocho Hernández); U.S. Department of Veterans Affairs BIRLS Death File 1850-2020; U.S. Veterans' Gravesites ca. 1775-2019. Miryam Cruz Arocho: U.S. Social Security Death Index 1935-2014 and U.S. Social Security Applications and Claims Index 1936-2007. All confirmed 2026-07-23.</div>`},

{doc:"The Branch That Wasn't: How a Merge Error Nearly Wrote Aztec Royalty Into This Book", html:`
  <span class="eyebrow">A cautionary chapter, added on purpose</span>
  <h1>For a while, this book almost said the family descended from Moctezuma. It doesn't.</h1>
  <p class="lead">Every family-history project runs into this eventually: a record that looks too good, a tree online that connects your family to someone famous, a name that matches just closely enough to feel like a discovery. This project hit that wall on María Ramona Román's line, and this page exists to explain exactly how it happened and how it got caught &mdash; because understanding a mistake is worth as much as any confirmed ancestor, and Omar asked for the full story to be part of the book, not quietly deleted.</p>
  <p>It started with a real, working assumption: María Ramona Román, one of the confirmed ancestors on the Arocho side, had a FamilySearch profile with almost nothing attached &mdash; no parents, no siblings, a dead end going back centuries. Then a hint surfaced connecting her to a woman named <strong>Anatilde Román Jurado</strong>, whose FamilySearch profile came with an enormous, richly documented family tree: Jurado, Sánchez, Blandón, Tangarife, Herrera, Aguirre, Agudelo &mdash; an entire Antioquia, Colombia lineage running back to the 1500s, eventually connecting, through a chain of "royal descent" links, toward Moctezuma I. It was a real family. It was thoroughly sourced. It just wasn't this family.</p>
  <p>The tell was simple arithmetic. Following the merged profile back generation by generation, one parent-child link required a mother to have given birth roughly ninety years before her own recorded death &mdash; or, depending on which end of the discrepancy you traced from, a parent decades too young or too old to plausibly be a parent at all. No document explained it, because there wasn't one; the connection had been made by an algorithm matching similar names across unrelated Latin American Catholic-parish record sets, and a well-meaning FamilySearch contributor had accepted the suggested merge without checking the math. Once merged, it looked completely legitimate &mdash; hundreds of names, real archival citations, a family tree that any researcher would be excited to find. It was just attached to the wrong woman.</p>
  <p>Two more names had crept in the same way, worth naming so nobody chases them again: a "María Yamecí Indígena," dated 1514, with no source at all attached to her beyond her presence in the merged chain &mdash; a placeholder someone had invented to bridge a gap, not a documented person. And the "royal descent" chain itself rested on exactly one citation: a Wikipedia article, cited as if it were a primary source, asserting a connection to Moctezuma I with no actual genealogical record backing any single link in the chain.</p>
  <p>None of it is in this family's tree. Once the ninety-year impossibility surfaced, this project traced the entire Jurado/Antioquia branch, confirmed it was a real, separately documented Colombian family with no verifiable connection to María Ramona Román, and detached it. The fix on FamilySearch itself &mdash; unmerging Anatilde Román Jurado from María Ramona Román's profile &mdash; is still an open task, flagged for whoever has FamilySearch edit access next; this project's own tree was never actually changed, since the merge only ever lived on the outside profile this project was comparing against, not in Omar's own Ancestry tree. But the lesson is the point of this page: <strong>a well-sourced tree and a correct tree are not the same thing</strong> if it's sourced for the wrong person. María Ramona Román's own parents remain unknown, honestly, which is a less exciting answer than Aztec royalty and a far more truthful one.</p>
  <div class="who">FamilySearch profile comparison, María Ramona Román vs. the merged Anatilde Román Jurado/Jurado-Sánchez-Blandón-Tangarife-Herrera-Aguirre-Agudelo lineage, identified and traced 2026. Chronological impossibility (a ~90-year parent-child gap) calculated directly from the dates on the merged profile's own chain. The "royal descent to Moctezuma I" claim traced to a single Wikipedia citation with no supporting genealogical record. None of this material is part of the confirmed family line in this book; it is documented here specifically so it is not rediscovered and mistaken for real in a future research pass.</div>`},

{doc:"What \"Trace to Taíno\" Actually Means", html:`
  <span class="eyebrow">A note on the limits of paper records</span>
  <h1>Every Puerto Rican family asks this question. Here's what this book can honestly say about it.</h1>
  <p class="lead">At some point in almost every Puerto Rican genealogy project, someone asks whether the family has Taíno blood. It's a fair question, and this project doesn't have a paper answer to it &mdash; which is itself worth explaining, rather than leaving as a silent gap.</p>
  <p>Puerto Rico's civil registration system, the backbone of almost every record in this book, only begins in 1885. Catholic parish registers go back further, into the 1700s and occasionally the 1600s, but they were kept by and for a colonial Spanish administration that classified people by racial and social category &mdash; <em>blanco</em>, <em>pardo</em>, <em>moreno</em>, <em>libre</em>, <em>esclavo</em> &mdash; categories built to track Spanish, African, and mixed ancestry, not to preserve Taíno lineage as such. By the time those records start, the demographic and administrative record of who specifically was of Taíno descent had already been folded into those broader categories for well over a century. There is no equivalent of a civil registration system that tracked Taíno ancestry as its own line the way this book has traced Spanish surnames back through Arecibo and Lares parish books.</p>
  <p>That doesn't mean the ancestry isn't there. Genetic studies of Puerto Rico's population have consistently found meaningful Indigenous mitochondrial DNA across the island's population &mdash; the demographic reality of Taíno survival through intermarriage is well established at the population level. What this book cannot do is name a specific Taíno ancestor by name, birth year, or town, the way it has for Isidro Núñez or Martín Arocho y Román, because no document of that kind survives to be found. Paper genealogy runs out where the paper runs out.</p>
  <p>The honest next step, for whoever picks this up, is a DNA test rather than another archive search &mdash; specifically an autosomal test (the kind offered by AncestryDNA, 23andMe, and similar services) checked against Indigenous-American reference populations, or a maternal-line mitochondrial DNA test if the question is specifically about direct matrilineal descent. That's a different kind of research than everything else in this book: it answers a biological question, not a documentary one, and it can't tell you which specific ancestor carried that line or when. This book has tried, throughout, not to claim more than its sources can support. On this question, the honest answer is: probably present in the population history, not yet traceable to a name.</p>
  <div class="who">General background on Puerto Rican civil registration (1885 onward), Catholic parish record-keeping, and Spanish colonial racial classification categories is public historical record, not a specific finding about this family. Population-level Indigenous mitochondrial DNA findings in Puerto Rico are documented in published genetic-anthropology research, not a specific test result for anyone in this family. No DNA test has been conducted as part of this project.</div>`},

{doc:"Juan Casiano: A Household Tracked Across Five Decades", html:`
  <span class="eyebrow">Río Grande, Puerto Rico &middot; 1879&ndash;1950</span>
  <h1>Sometimes the record trail is so solid it just needs walking, not guessing.</h1>
  <p class="lead"><strong>Juan Casiano Vargas Lebrón</strong> is Beatriz Vargas y Román's father &mdash; Omar's great-grandfather, on Juan José Huertas's side. For a while, everything this book knew about him came from a stranger's public "Vargas Family Tree," the kind of secondhand source this project has always treated as a lead rather than a fact. Then his own hint queue got opened properly, and it turned out he barely needed anyone else's research at all.</p>
  <p>His own marriage record, filed in Carolina on 13 August 1906, names his bride as Consuela Vargas Lebrón. From there, five separate census years &mdash; 1910, 1920, 1935, 1940, and 1950 &mdash; track the same household without a break, always in the same corner of Río Grande, Ciénaga Baja. The names drift with each census taker's ear and handwriting &mdash; Bargas, Vargas, Casiano, Lebrón, in every order &mdash; but the people don't: Consuelo, and children Angelina, Eufrasio (sometimes Eufracia), and María Teresa, appearing again and again across four decades of paperwork. And his own WWI and WWII draft cards, filled out twenty-five years apart, agree with each other exactly on his birthdate: 13 August 1879, Río Grande &mdash; no drift at all, unlike some of the other men in this book whose two cards disagree by years.</p>
  <p>One thread was deliberately left alone. A different, non-primary "Vargas Family Tree" proposes that Juan's own parents were <strong>Pedro P. Vargas Castro</strong> and <strong>Rosalia Mercado</strong>, and that he died around 1950 in Chicago. It's a specific, plausible-sounding claim &mdash; but no primary document has surfaced to back any part of it, and this book has been burned before by specific, plausible-sounding claims from strangers' trees. It's recorded here as exactly what it is: a lead for whoever picks this up next, not a fact.</p>
  <p>The other half of this household turned out to be a lesson in how easily a good hint queue can lead somewhere wrong. Ana Rosa Pineda, Juan's wife and Beatriz's mother, had seven of her own hints waiting &mdash; five censuses, a passenger list, a family tree. Every single one of them, on closer look, described a different woman: a "Rosa Rosario," not Pineda, married to a different Casiano Vargas, living in Quebradillas rather than Río Grande, raising children named Balbino, Teodoro, and Cecilia that don't appear anywhere in the household this book just spent a page confirming. All seven were rejected. It's the cleanest example in this whole project of why every hint gets checked individually rather than accepted on a name match alone &mdash; the algorithm found a woman with a similar name in a nearby town, and nothing about her family actually belonged to ours.</p>
  <div class="who">Puerto Rico Civil Registrations 1885&ndash;2001 (Juan Casiano Vargas Lebrón's 1906 marriage record). U.S. Federal Census 1910, 1920, 1940, 1950; Puerto Rico Social and Population Schedules 1935-1936. U.S., WWI Draft Registration Cards 1917-1918 and U.S., World War II Draft Registration Cards 1942, both for Juan Casiano Vargas Lebrón. All confirmed 2026-07-24. The Pedro P. Vargas Castro / Rosalia Mercado parentage and Chicago death claim come from a non-primary public family tree and are not part of this book's confirmed line.</div>`},

{doc:"Sources for the Historical Context", html:`
  <span class="eyebrow">Where the town history came from</span>
  <h1>Notes on the world around the family.</h1>
  <p class="lead">The events in this book split into two kinds: what a document says about a specific person, and what public history says about the towns they lived in. Here's where the second kind came from.</p>
  <h2>Añasco &amp; Lares, founding and coffee economy</h2>
  <p>Añasco founding history &mdash; topuertorico.org, Wikipedia. Lares founding and the coffee economy &mdash; boricua.com; "Toward Puerto Rico's Grito de Lares: Coffee, Social Stratification, and Class Conflicts, 1828&ndash;1868," <em>Hispanic American Historical Review</em>, Duke University Press.</p>
  <h2>The Grito de Lares, 1868</h2>
  <p>Encyclopedia.com, "Grito de Lares"; Library of Congress research guides.</p>
  <h2>1898 transition &amp; the 1899 San Ciriaco hurricane</h2>
  <p>Wikipedia, "1899 San Ciriaco hurricane"; Library of Congress, "World of 1898" research guide; Duke University Press, "The Hurricane of San Ciriaco: Disaster, Politics, and Society in Puerto Rico, 1899&ndash;1901."</p>
  <h2>Arecibo's economy, early 1900s</h2>
  <p>Grokipedia, "Arecibo, Puerto Rico"; U.S. Census figures for Arecibo, 1899 &amp; 1910.</p>
  <h2>The Great Migration, 1950s</h2>
  <p>HISTORY.com, "Why Puerto Rican Migration to the US Boomed After 1945"; National Trust for Historic Preservation, "Becoming 'Nuyorican'."</p>
  <div class="who">None of this history is a record of this specific family &mdash; it's the documented backdrop they lived against. Every claim about the family itself is sourced separately, on the pages where it appears.</div>`},

const book=document.getElementById('book');
const total=PAGES.length;
document.getElementById('tot').textContent=total;
const pageEls=[];
PAGES.forEach((pg,i)=>{
  const el=document.createElement('div');el.className='page';
  const front=document.createElement('div');front.className='face front';
  if(pg.cover) front.classList.add('cover');
  else if(pg.back) front.classList.add('back-cover');
  if(pg.cover||pg.back){
    if(pg.cover) front.innerHTML='<div class="c-aurora"></div>'+pg.html;
    else front.innerHTML='<div class="bc-aurora"></div>'+pg.html;
  } else {
    front.innerHTML =
      '<div class="p-head"><span class="ph-brand"><span class="ph-mark">🌳</span>'+
      '<span class="ph-name">Arocho &ndash; Marrero &ndash; Huertas</span></span>'+
      '<span class="ph-doc">'+(pg.doc||DOC)+'</span></div>'+
      '<div class="p-rule"></div>'+
      '<div class="p-body">'+pg.html+'</div>'+
      '<div class="p-foot"><span class="pf-c">A Family History</span>'+
      '<span class="pf-n">'+String(i+1).padStart(2,'0')+'</span></div>';
  }
  el.appendChild(front);
  book.appendChild(el);
  pageEls.push(el);
});

let cur=0;
function render(){
  pageEls.forEach((el,i)=>{
    const turned = i<cur;
    el.classList.toggle('turned',turned);
    el.style.zIndex = turned ? i : (total - i);
  });
  document.getElementById('cur').textContent=Math.min(cur+1,total);
  document.getElementById('progress').firstElementChild.style.width=((cur)/(total-1)*100)+'%';
  document.getElementById('prev').disabled=cur<=0;
  document.getElementById('next').disabled=cur>=total-1;
}
function next(){if(cur<total-1){cur++;render();}}
function prev(){if(cur>0){cur--;render();}}
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
book.addEventListener('click',e=>{const r=book.getBoundingClientRect();(e.clientX-r.left)/r.width>0.5?next():prev();});
render();
</script>
</div>
<script>
(function () {
  var HASH = "58a03e386b049cffcd66a36fc38c28adb4461a86288fca76db5e76cb6e022042";
  async function sha256(msg) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("content").style.display = "block";
    try { sessionStorage.setItem("ft_unlocked", "1"); } catch (e) {}
  }
  async function tryPassword() {
    var pw = document.getElementById("gate-pw").value;
    var h = await sha256(pw);
    if (h === HASH) { unlock(); } else { document.getElementById("gate-err").textContent = "Wrong password."; }
  }
  document.getElementById("gate-go").addEventListener("click", tryPassword);
  document.getElementById("gate-pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPassword(); });
  try { if (sessionStorage.getItem("ft_unlocked") === "1") unlock(); } catch (e) {}
})();
</script>
